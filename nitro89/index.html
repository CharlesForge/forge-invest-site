"use strict";
/* ================= ECRAN ================= */
const cv=document.getElementById('c'),ctx=cv.getContext('2d');

 cv.width=Math.round(W*nr);cv.height=Math.round(H*nr);const cw=W*SC,chh=H*SC;OFX=(IW-cw)/2;OFY=(IH-chh)/2;

/* ================= COULEURS (palette STE 4096) ================= */
const A=(r,g,b)=>[r*17,g*17,b*17];
const c16=(r,g,b)=>`rgb(${r*17},${g*17},${b*17})`;
const BLK=c16(0,0,0),WHT=c16(15,15,15),YEL=c16(15,15,2),RED=c16(15,2,1),CYA=c16(6,13,15),GRN=c16(6,15,6),ORA=c16(15,9,0);
function fr(g,c,x,y,w,h){g.fillStyle=c;g.fillRect(x,y,w,h);}

function circ(g,cx,cy,r,c){g.fillStyle=c;const r2=r*r+r*.7;for(let dy=-Math.ceil(r);dy<=Math.ceil(r);dy++){if(dy*dy>r2)continue;const w=Math.floor(Math.sqrt(r2-dy*dy));g.fillRect(cx-w,cy+dy,2*w+1,1);}}
function ell(g,cx,cy,rx,ry,c){g.fillStyle=c;for(let dy=-ry;dy<=ry;dy++){const w=Math.floor(rx*Math.sqrt(Math.max(0,1-(dy*dy)/(ry*ry+.5))));g.fillRect(Math.round(cx-w),Math.round(cy+dy),2*w+1,1);}}

/* ================= ALEATOIRE ================= */
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function hh(x,y,s){let h=(Math.imul(x|0,374761393)+Math.imul(y|0,668265263)+Math.imul((s|0)+1,1442695041))|0;h=Math.imul(h^(h>>>13),1274126177);h^=h>>>16;return(h>>>0)/4294967296;}
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
function wrapA(a){while(a>Math.PI)a-=Math.PI*2;while(a<-Math.PI)a+=Math.PI*2;return a;}

/* ================= TEXTE ================= */
const FONT_F="'Russo One','Arial Black','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Noto Sans CJK JP','Apple SD Gothic Neo','Geeza Pro','Noto Naskh Arabic',Arial,sans-serif";

function txt(s,x,y,col='#fff',o={}){s=norm(s);const g=o.g||ctx,sz=(o.sc||1)*8.4;g.save();g.font=`${sz}px ${FONT_F}`;g.textBaseline='top';g.textAlign=o.al==='c'?'center':o.al==='r'?'right':'left';
 const w=g.measureText(s).width;let fill=col;if(o.rows){const gr=g.createLinearGradient(0,y+sz*.1,0,y+sz*.95);const n=o.rows.length;o.rows.forEach((c,i)=>gr.addColorStop(i/(n-1),c));fill=gr;}
 if(o.ol){g.lineJoin='round';g.lineWidth=Math.max(1.4,sz*.24);g.strokeStyle='rgba(0,0,0,0.9)';g.strokeText(s,x,y);if(o.sc>=2&&state!=='race'){g.shadowColor='rgba(0,0,0,0.5)';g.shadowBlur=sz*.5*RES;}}
 else{g.fillStyle='rgba(0,0,0,0.6)';g.fillText(s,x+Math.max(.6,sz*.07),y+Math.max(.6,sz*.08));}
 g.fillStyle=fill;g.fillText(s,x,y);g.restore();return w;}
function wtext(g,s,x,y,sz,col,al){g.save();g.font=`${sz}px ${FONT_F}`;g.textBaseline='middle';g.textAlign=al||'center';g.fillStyle=col;g.fillText(s,x,y);g.restore();}

/* ================= OUTILS DE DESSIN ================= */
const TAU=Math.PI*2;
const _cc=new Map();
function adj(c,k){const key=c+'|'+k;let v=_cc.get(key);if(v)return v;let m;if(c[0]==='#'){const n=parseInt(c.slice(1),16);m=[n>>16,(n>>8)&255,n&255];}else m=c.match(/\d+/g).map(Number);
 const f=k>0?x=>x+(255-x)*k:x=>x*(1+k);v=`rgb(${f(m[0])|0},${f(m[1])|0},${f(m[2])|0})`;_cc.set(key,v);return v;}
function rgba(c,a){let m;if(c[0]==='#'){const n=parseInt(c.slice(1),16);m=[n>>16,(n>>8)&255,n&255];}else m=c.match(/\d+/g).map(Number);return`rgba(${m[0]},${m[1]},${m[2]},${a})`;}
const cssA=a=>`rgb(${a[0]},${a[1]},${a[2]})`;
function rr(g,x,y,w,h,r){r=Math.max(0,Math.min(r,w/2,h/2));g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath();}
function frr(g,c,x,y,w,h,r){rr(g,x,y,w,h,r);g.fillStyle=c;g.fill();}
function disc(g,x,y,r,c){g.beginPath();g.arc(x,y,Math.max(.01,r),0,TAU);g.fillStyle=c;g.fill();}
function lgr(g,x0,y0,x1,y1,cs){const gr=g.createLinearGradient(x0,y0,x1,y1);const n=cs.length;cs.forEach((c,i)=>{if(Array.isArray(c))gr.addColorStop(c[0],c[1]);else gr.addColorStop(n>1?i/(n-1):0,c);});return gr;}
function rgr(g,x,y,r,cs,fx,fy){const gr=g.createRadialGradient(fx===undefined?x:fx,fy===undefined?y:fy,0,x,y,Math.max(.01,r));const n=cs.length;cs.forEach((c,i)=>{if(Array.isArray(c))gr.addColorStop(c[0],c[1]);else gr.addColorStop(n>1?i/(n-1):0,c);});return gr;}
function scaleOf(g){try{const T=g.getTransform();return Math.hypot(T.a,T.b);}catch(e){return RES;}}
function withShadow(g,blur,ox,oy,col,fn){let T;try{T=g.getTransform();}catch(e){T={a:RES,b:0};}const k=Math.hypot(T.a,T.b);g.save();g.shadowColor=col;g.shadowBlur=blur*k;g.shadowOffsetX=ox*k+4000*T.a;g.shadowOffsetY=oy*k+4000*T.b;g.translate(-4000,0);g.fillStyle='#000';g.strokeStyle='#000';fn(g);g.restore();}
function shadowRect(g,x,y,w,h,ox,oy,blur,a,r){withShadow(g,blur,ox,oy,`rgba(0,0,25,${a})`,gg=>{if(r){rr(gg,x,y,w,h,r);gg.fill();}else gg.fillRect(x,y,w,h);});}
function softEll(g,x,y,rx,ry,a){g.save();g.translate(x,y);g.scale(1,ry/rx);g.fillStyle=rgr(g,0,0,rx,[`rgba(0,0,25,${a})`,`rgba(0,0,25,${a*.8})`,'rgba(0,0,25,0)']);g.beginPath();g.arc(0,0,rx,0,TAU);g.fill();g.restore();}
function mkc(w,h,draw,ss){const k=RES*(ss||1);const c=document.createElement('canvas');c.width=Math.max(1,Math.ceil(w*k));c.height=Math.max(1,Math.ceil(h*k));const g=c.getContext('2d');g.scale(k,k);draw(g);return c;}
function stripes(g,x,y,w,h,c1,c2,sw,vert){g.save();g.beginPath();g.rect(x,y,w,h);g.clip();g.fillStyle=c1;g.fillRect(x,y,w,h);g.fillStyle=c2;if(vert){for(let k=0;k<w;k+=sw*2)g.fillRect(x+k+sw,y,sw,h);}else{for(let k=-h;k<w;k+=sw*2){g.beginPath();g.moveTo(x+k,y+h);g.lineTo(x+k+sw,y+h);g.lineTo(x+k+sw+h,y);g.lineTo(x+k+h,y);g.closePath();g.fill();}}g.restore();}

function carBody(g){g.beginPath();g.moveTo(11.6,-4.4);g.bezierCurveTo(12.7,-2,12.7,2,11.6,4.4);g.lineTo(7.5,6.2);g.lineTo(-9.2,6.4);g.quadraticCurveTo(-12,6.2,-12.1,3.8);g.lineTo(-12.1,-3.8);g.quadraticCurveTo(-12,-6.2,-9.2,-6.4);g.lineTo(7.5,-6.2);g.closePath();}

 for(const sx of[-7.4,7.2])for(const sy of[-6.5,6.5]){frr(g,'#0e0e10',sx-2.7,sy-1.5,5.4,3,1.1);g.fillStyle='rgba(255,255,255,0.18)';g.fillRect(sx-2,sy-.4,4,.5);}
 carBody(g);g.fillStyle=lgr(g,0,-6.5,0,6.5,[[0,adj(p.b,-.55)],[.16,adj(p.b,-.1)],[.36,adj(p.b,.32)],[.52,p.b],[.85,adj(p.b,-.25)],[1,adj(p.b,-.6)]]);g.fill();
 g.lineWidth=.45;g.strokeStyle=adj(p.b,-.7);g.stroke();
 g.save();carBody(g);g.clip();g.fillStyle=lgr(g,-12,0,12,0,['rgba(0,0,0,0.25)','rgba(0,0,0,0)','rgba(255,255,255,0.12)','rgba(0,0,0,0)']);g.fillRect(-13,-7,26,14);
 if(p.s!==p.b){g.fillStyle=p.s;g.globalAlpha=.92;g.fillRect(-13,-1.7,26,1.15);g.fillRect(-13,.55,26,1.15);g.globalAlpha=1;}g.restore();
 g.beginPath();g.moveTo(6.3,-4.7);g.lineTo(2.6,-5.3);g.lineTo(2.6,5.3);g.lineTo(6.3,4.7);g.quadraticCurveTo(7.2,0,6.3,-4.7);g.closePath();g.fillStyle=lgr(g,2.6,0,7,0,['#0a1322','#23426a','#7aa8da']);g.fill();
 rr(g,-4.8,-5,7.4,10,1.8);g.fillStyle=lgr(g,-4.8,-5,-4.8,5,[adj(p.b,.05),adj(p.b,.28),adj(p.b,-.05)]);g.fill();
 g.fillStyle='rgba(255,255,255,0.22)';rr(g,-4,-4.2,5.5,3.2,1.2);g.fill();
 g.beginPath();g.moveTo(-4.8,-4.7);g.lineTo(-8,-4.2);g.lineTo(-8,4.2);g.lineTo(-4.8,4.7);g.closePath();g.fillStyle=lgr(g,-8,0,-4.8,0,['#0c1628','#2a4366']);g.fill();
 g.strokeStyle='rgba(255,255,255,0.6)';g.lineWidth=.55;g.beginPath();g.moveTo(5.6,-3.6);g.lineTo(3.6,1.8);g.stroke();
 for(const sy of[-4.2,4.2]){g.fillStyle=parked?'#cfcbb0':'#fffbe0';g.beginPath();g.ellipse(11.3,sy,.95,1.35,0,0,TAU);g.fill();}
 g.fillStyle='#e01810';for(const sy of[-4.7,4.7])frr(g,'#e01810',-12.4,sy-1.1,1.1,2.2,.4);
 if(!parked)frr(g,adj(p.b,-.6),-12.9,-6.3,1.7,12.6,.6);
 g.fillStyle=adj(p.b,-.35);g.fillRect(3.1,-7.1,1.5,1);g.fillRect(3.1,6.1,1.5,1);}
function carSprite(p,parked){return{c:mkc(32,32,g=>{g.translate(16,16);drawCarVec(g,p,parked);},2),s:mkc(40,40,g=>{withShadow(g,2.2,0,0,'rgba(0,0,20,0.75)',gg=>{gg.translate(20,20);carBody(gg);gg.fill();});},1)};}
let CARS_HD=[];const pcache=new Map();
/* ---------- modèles de voitures ---------- */
function wheel(g,x,y,w,h){frr(g,'#0c0c0e',x-w/2,y-h/2,w,h,1);g.fillStyle='rgba(255,255,255,0.16)';g.fillRect(x-w/2+.6,y-.25,w-1.2,.5);g.strokeStyle='rgba(255,255,255,0.08)';g.lineWidth=.3;for(let k=-w/2+1;k<w/2;k+=1.2){g.beginPath();g.moveTo(x+k,y-h/2);g.lineTo(x+k,y+h/2);g.stroke();}}
function bodyFill(g,b,out){out(g);g.fillStyle=lgr(g,0,-6.5,0,6.5,[[0,adj(b,-.55)],[.16,adj(b,-.1)],[.36,adj(b,.32)],[.52,b],[.85,adj(b,-.25)],[1,adj(b,-.6)]]);g.fill();g.lineWidth=.45;g.strokeStyle=adj(b,-.7);g.stroke();}

 if(l==='stripes'){g.fillStyle=p.s;g.globalAlpha=.92;g.fillRect(-13,-1.8,26,1.15);g.fillRect(-13,.65,26,1.15);}
 else if(l==='flames'){for(const sy of[-1,1]){g.fillStyle='#ff6a10';g.beginPath();g.moveTo(13,sy*6.6);for(let k=0;k<5;k++){g.lineTo(9-k*3.2,sy*(3.2+(k%2)*2));g.lineTo(7.4-k*3.2,sy*6.6);}g.closePath();g.fill();g.fillStyle='#ffd23a';g.beginPath();g.moveTo(13,sy*6.6);for(let k=0;k<4;k++){g.lineTo(9.5-k*3.2,sy*(4.6+(k%2)*1.2));g.lineTo(8-k*3.2,sy*6.6);}g.closePath();g.fill();}}
 else if(l==='zebra'){g.strokeStyle=p.s||'#111';g.lineWidth=1.1;for(let x=-12;x<13;x+=2.4){g.beginPath();g.moveTo(x,-7);g.quadraticCurveTo(x+1.4,0,x,7);g.stroke();}}

 else if(l==='tartan'){g.globalAlpha=.55;g.strokeStyle='#c81e2a';g.lineWidth=.7;for(let x=-12;x<13;x+=3){g.beginPath();g.moveTo(x,-7);g.lineTo(x,7);g.stroke();}for(let y=-6;y<7;y+=3){g.beginPath();g.moveTo(-13,y);g.lineTo(13,y);g.stroke();}g.strokeStyle='#f0e0a0';g.lineWidth=.25;for(let x=-10.5;x<13;x+=3){g.beginPath();g.moveTo(x,-7);g.lineTo(x,7);g.stroke();}}
 g.restore();}

   g.strokeStyle='rgba(0,0,0,0.55)';g.lineWidth=.5;for(let x=-4.6;x>-10.5;x-=1.3){g.beginPath();g.moveTo(x,-3.6);g.lineTo(x,3.6);g.stroke();}

  draw:(g,p,pk)=>{for(const x of[7,-7.4])for(const sy of[-1,1])wheel(g,x,sy*5.9,4.6,2.4);const O=CARM.spinner.out;bodyFill(g,p.b,O);livery(g,p,O);

let TILE={},TILEW={};
function mkTile(wu,hu,fn){const c=document.createElement('canvas');c.width=Math.round(wu*RES);c.height=Math.round(hu*RES);const g=c.getContext('2d');g.scale(RES,RES);fn(g,c);return c;}
function grain(g,amp,seed){const c=g.canvas,im=g.getImageData(0,0,c.width,c.height),d=im.data,R=rng(seed);for(let i=0;i<d.length;i+=4){const n=(R()-.5)*amp;d[i]+=n;d[i+1]+=n;d[i+2]+=n;}g.putImageData(im,0,0);}
function blotches(g,wu,hu,n,seed,dark,light,rmin,rmax){const R=rng(seed);for(let i=0;i<n;i++){const x=R()*wu,y=R()*hu,r=rmin+R()*(rmax-rmin),c=R()<.5?dark:light;for(const ox of[-wu,0,wu])for(const oy of[-hu,0,hu]){g.fillStyle=rgr(g,x+ox,y+oy,r,[c,'rgba(0,0,0,0)']);g.fillRect(x+ox-r,y+oy-r,2*r,2*r);}}}
function pat(g,tile){const p=g.createPattern(tile,'repeat');try{p.setTransform(new DOMMatrix([1/RES,0,0,1/RES,0,0]));}catch(e){}return p;}
function patFill(g,tile,x,y,w,h){g.fillStyle=pat(g,tile);g.fillRect(x,y,w,h);}
function asphTile(base,seed){return mkTile(96,96,(g)=>{g.fillStyle=base;g.fillRect(0,0,96,96);blotches(g,96,96,26,seed,'rgba(0,0,0,0.10)','rgba(255,255,255,0.05)',4,16);grain(g,22,seed+1);
 const R=rng(seed+2);for(let i=0;i<60;i++){g.fillStyle=R()<.5?'rgba(255,255,255,0.12)':'rgba(0,0,0,0.18)';g.fillRect(R()*96,R()*96,.5,.5);}
 g.strokeStyle='rgba(0,0,0,0.22)';g.lineWidth=.35;for(let i=0;i<3;i++){let x=R()*96,y=R()*96;g.beginPath();g.moveTo(x,y);for(let k=0;k<5;k++){x+=(R()-.5)*8;y+=(R()-.5)*8;g.lineTo(x,y);}g.stroke();}});}
function walkTile(c0,c1,c2,seed){return mkTile(16,16,(g)=>{const R=rng(seed);for(let i=0;i<2;i++)for(let j=0;j<2;j++){const k=R();g.fillStyle=k<.25?c2:k<.5?adj(c0,-.04):c0;g.fillRect(i*8,j*8,8,8);g.fillStyle='rgba(255,255,255,0.22)';g.fillRect(i*8,j*8,8,.45);g.fillRect(i*8,j*8,.45,8);g.fillStyle=rgba(c1,.8);g.fillRect(i*8,j*8+7.55,8,.45);g.fillRect(i*8+7.55,j*8,.45,8);}grain(g,14,seed+3);});}
function cobbleTile(P,seed){return mkTile(24,20,(g)=>{g.fillStyle=P[3];g.fillRect(0,0,24,20);const R=rng(seed);for(let row=0;row<4;row++){const off=(row&1)*3;for(let k=-1;k<5;k++){const x=k*6+off,y=row*5;const base=R()<.3?P[1]:R()<.75?P[0]:P[2];g.fillStyle=rgr(g,x+2.4,y+2,4,[adj(base,.25),base,adj(base,-.3)],x+1.8,y+1.4);rr(g,x+.5,y+.5,5,4,1.4);g.fill();}}grain(g,12,seed+5);});}

 TILE.grass=mkTile(64,64,g=>{g.fillStyle='rgb(58,138,40)';g.fillRect(0,0,64,64);blotches(g,64,64,30,11,'rgba(10,60,0,0.22)','rgba(190,230,90,0.16)',4,12);grain(g,26,12);const R=rng(13);g.lineWidth=.3;for(let i=0;i<260;i++){const x=R()*64,y=R()*64;g.strokeStyle=R()<.5?'rgba(20,70,10,0.5)':'rgba(170,220,90,0.5)';g.beginPath();g.moveTo(x,y);g.lineTo(x+(R()-.5)*1.2,y-1-R());g.stroke();}});

 TILE.dirt=mkTile(48,48,g=>{g.fillStyle='rgb(128,92,56)';g.fillRect(0,0,48,48);blotches(g,48,48,20,81,'rgba(60,35,10,0.25)','rgba(200,160,110,0.18)',3,10);grain(g,26,82);});

function buildWorldTiles(wd){const key=wd.name+'_'+RES;if(TILEW.key===key)return;TILEW={key};if(wd.open){buildOpenTiles(wd);return;}
 if(wd.road==='cobble')TILEW.road=cobbleTile(wd.cob.map(cssA),101);else if(wd.road==='beton')TILEW.road=betonTile();else if(wd.road==='sable')TILEW.road=gravelTile();else TILEW.road=asphTile(cssA(wd.asph[0]),102+wd.name.length);

const TREEPAL={green:['#173f10','#2c751b','#4ea52a','#9ad85c'],light:['#2a5512','#4a8b20','#78bc36','#c2e676'],dark:['#0b2010','#153c1a','#235826','#427e40']};
const treeCache=new Map();
function treeSprite(r,pk,v){const key=r+pk+v;let c=treeCache.get(key);if(c)return c;const P=TREEPAL[pk]||TREEPAL.green;const R=rng(v*131+r*7+1);const S=2*r+6;
 c=mkc(S,S,g=>{const m=S/2;const cl=[[0,0,r*.6]];const n=5+(r/3|0);for(let i=0;i<n;i++){const a=R()*TAU,d=R()*r*.42;cl.push([Math.cos(a)*d,Math.sin(a)*d,r*(.36+R()*.2)]);}
  for(const k of cl)disc(g,m+k[0]+.5,m+k[1]+.6,k[2]+.3,P[0]);
  cl.sort((a,b)=>(b[0]+b[1])-(a[0]+a[1]));
  for(const k of cl){const x=m+k[0],y=m+k[1],q=k[2];g.fillStyle=rgr(g,x,y,q,[[0,P[3]],[.35,P[2]],[.8,P[1]],[1,P[0]]],x-q*.45,y-q*.5);g.beginPath();g.arc(x,y,q,0,TAU);g.fill();}
  for(let i=0;i<r*r*1.1;i++){const a=R()*TAU,d=Math.sqrt(R())*r*.92;const x=m+Math.cos(a)*d,y=m+Math.sin(a)*d;g.fillStyle=R()<.55?'rgba(0,20,0,0.16)':'rgba(255,255,200,0.15)';g.beginPath();g.arc(x,y,.35+R()*.6,0,TAU);g.fill();}},1);
 treeCache.set(key,c);return c;}
function drawTree(g,x,y,r,pk,v){r=Math.max(3,r|0);softEll(g,x+r*.5,y+r*.45,r*1.05,r*.85,.34);const s=treeSprite(r,pk||'green',(v|0)%6),S=2*r+6;g.drawImage(s,x-S/2,y-S/2,S,S);}

const _logo=new Map();let _mctx=null;
function _mw(font,s){if(!_mctx)_mctx=document.createElement('canvas').getContext('2d');_mctx.font=font;return _mctx.measureText(s).width;}
function logoParts(sc,row){const key=sc.toFixed(2)+'_'+(row?1:0)+'_'+RES;let L=_logo.get(key);if(L)return L;
 const fs=(row?8.8:8.5)*sc,f2=fs*(row?.98:1),SK=.24,pad=fs*.42,fN=`${fs}px 'Russo One','Arial Black',sans-serif`,f89=`${f2}px Monoton,'Russo One',sans-serif`;
 const wN=_mw(fN,'NITRO')+fs*SK*.75,w89=_mw(f89,'89');let cw,ch,nx,ny,ex,ey;
 if(row){cw=wN+fs*.3+w89+pad*2;ch=fs*1.05+pad*2;nx=pad+fs*SK*.75;ny=pad+fs*.8;ex=pad+wN+fs*.3;ey=ny+fs*.02;}
 else{cw=Math.max(wN,w89+fs*.9)+pad*2;ch=fs*.8+f2*.9+pad*2;nx=pad+fs*SK*.75+(cw-2*pad-wN)/2;ny=pad+fs*.8;ex=cw-pad-w89-fs*.05;ey=ny+f2*.86;}
 const capT=ny-fs*.72,capB=ny;
 // chrome NITRO (texte seul, coupé de lignes)
 const chrome=mkc(cw,ch,g=>{g.save();g.translate(nx,ny);g.transform(1,0,-SK,1,0,0);g.font=fN;g.textBaseline='alphabetic';
   g.fillStyle=lgr(g,0,-fs*.72,0,0,[[0,'#f4fbff'],[.3,'#8fd2ff'],[.48,'#e8f6ff'],[.5,'#1a0630'],[.56,'#4a1060'],[.72,'#c0306a'],[.9,'#ff9a3a'],[1,'#ffe9a8']]);g.fillText('NITRO',0,0);g.restore();
   g.globalCompositeOperation='destination-out';for(let k=0;k<5;k++){const yy=capT+(capB-capT)*(.58+k*.085);g.fillRect(0,yy,cw,Math.max(.35,fs*.012*(k+1)));}});
 const base=mkc(cw,ch,g=>{g.font=fN;g.textBaseline='alphabetic';
   // halo
   g.save();g.translate(nx,ny);g.transform(1,0,-SK,1,0,0);g.shadowBlur=fs*.55*RES;g.shadowColor='#ff1a8c';g.fillStyle='rgba(255,40,150,0.9)';g.fillText('NITRO',0,0);g.shadowColor='#22d8ff';g.shadowBlur=fs*.3*RES;g.fillStyle='rgba(30,200,255,0.5)';g.fillText('NITRO',-fs*.03,-fs*.03);g.restore();
   // extrusion 3D
   g.save();g.translate(nx,ny);g.transform(1,0,-SK,1,0,0);const n=Math.max(4,Math.round(fs*.11));for(let k=n;k>=1;k--){g.fillStyle=k===n?'#05010c':`rgb(${40+k*4},${8+k*2},${60+k*6})`;g.fillText('NITRO',k*fs*.012,k*fs*.014);}
   g.lineWidth=fs*.05;g.strokeStyle='#0a0216';g.lineJoin='round';g.strokeText('NITRO',0,0);g.restore();
   g.drawImage(chrome,0,0,cw,ch);
   g.save();g.translate(nx,ny);g.transform(1,0,-SK,1,0,0);g.lineWidth=Math.max(.3,fs*.018);g.strokeStyle='rgba(255,255,255,0.85)';g.strokeText('NITRO',0,0);g.restore();
   // éclat
   const sx=nx-fs*SK*.55+fs*.05,sy=capT+fs*.04;g.save();g.shadowColor='#fff';g.shadowBlur=fs*.25*RES;g.fillStyle='#fff';g.beginPath();const r1=fs*.2,r2=fs*.025;for(let a=0;a<8;a++){const r=a%2?r2:r1,an=a*Math.PI/4;g.lineTo(sx+Math.cos(an)*r,sy+Math.sin(an)*r);}g.closePath();g.fill();g.restore();
   // katakana néon rouge
   const kf=fs*(row?.2:.27);g.save();g.font=`${kf}px 'Hiragino Sans','Noto Sans JP','Noto Sans CJK JP',sans-serif`;g.textAlign='center';g.shadowColor='#ff2020';g.shadowBlur=kf*.6*RES;g.fillStyle='#ff4a3a';
   if(row){g.fillText('ニトロ',ex+w89*.5,ch-pad*.25);}else{const kx=pad+fs*.25;['ニ','ト','ロ'].forEach((c,i)=>g.fillText(c,kx,ny+kf*1.25+i*kf*1.1));g.fillStyle='#ffd0c8';g.shadowBlur=0;}g.restore();});
 const neon=mkc(cw,ch,g=>{g.font=f89;g.textBaseline='alphabetic';
   g.save();g.shadowColor='#ff2ad4';g.shadowBlur=f2*.35*RES;g.fillStyle='#ff3ac8';g.fillText('89',ex,ey);g.shadowBlur=f2*.15*RES;g.fillText('89',ex,ey);g.restore();
   g.save();g.shadowColor='#ffb0f0';g.shadowBlur=f2*.05*RES;g.fillStyle='#ffe6fa';g.globalAlpha=.85;g.fillText('89',ex+f2*.004,ey-f2*.004);g.restore();
   // barre néon cyan
   const by=row?ey+fs*.12:ey+f2*.1,bx0=row?ex:ex-fs*.35,bx1=ex+w89;g.save();g.shadowColor='#22e0ff';g.shadowBlur=fs*.25*RES;g.strokeStyle='#7af0ff';g.lineWidth=Math.max(.5,fs*.03);g.lineCap='round';g.beginPath();g.moveTo(bx0,by);g.lineTo(bx1,by);g.stroke();g.restore();});
 L={base,neon,cw,ch,pad};_logo.set(key,L);if(_logo.size>8)_logo.delete(_logo.keys().next().value);return L;}

function mpLoadLib(cb){if(window.Peer){cb();return;}MP.status='CHARGEMENT DU RÉSEAU...';const s=document.createElement('script');s.src='https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js';s.onload=()=>{MP.status='';cb();};s.onerror=()=>{MP.status='RÉSEAU INDISPONIBLE ICI · JOUE SUR FORGE-INVEST.FR/NITRO89';};document.head.appendChild(s);}

function mpHost(){mpLoadLib(()=>{const code=Array.from({length:4},()=>'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'[Math.random()*32|0]).join('');let peer;try{peer=new Peer('nitro89-'+code);}catch(e){MP.status='ERREUR RÉSEAU';return;}MP.peer=peer;MP.status='CRÉATION DE LA PARTIE...';
 peer.on('open',()=>{MP.on=true;MP.host=true;MP.code=code;MP.slot=0;MY=0;MP.diff=diffSet;MP.players=[mpMe(),null,null,null];MP.status='';setState('lobby');});
 peer.on('error',e=>{if(e.type==='unavailable-id'){try{peer.destroy();}catch(_){}mpHost();return;}MP.status='ERREUR RÉSEAU : '+String(e.type||'').toUpperCase();});
 peer.on('connection',conn=>{conn.on('open',()=>{const slot=[1,2,3].find(i=>!MP.players[i]);if(!slot||state==='race'){try{conn.send({t:'full'});}catch(e){}setTimeout(()=>{try{conn.close();}catch(e){}},400);return;}
   conn.slot=slot;MP.conns.push(conn);MP.players[slot]={name:'...',car:rivalCar(0,1)};conn.send({t:'welcome',slot,code:MP.code});beep(880,.08);});
  conn.on('data',m=>mpHostMsg(conn,m));conn.on('close',()=>mpDrop(conn));conn.on('error',()=>mpDrop(conn));});});}
function mpDrop(conn){const i=MP.conns.indexOf(conn);if(i<0)return;MP.conns.splice(i,1);const s=conn.slot;const nm=MP.players[s]&&MP.players[s].name;MP.players[s]=null;
 if(state==='race'){const c=cars.find(q=>q.id===s);if(c){c.remote=false;c.human=false;c.ai=true;pop(player().x,player().y-30,(nm||'JOUEUR')+' PARTI','#ff9a5a');}}mpBroadcast(mpLobbyMsg());}
function mpHostMsg(conn,m){if(!m||!m.t)return;if(m.t==='hello'){MP.players[conn.slot]={name:String(m.name||'JOUEUR').toUpperCase().slice(0,14),car:m.car||rivalCar(0,1)};mpBroadcast(mpLobbyMsg());}
 else if(m.t==='me'&&state==='race'){const c=cars.find(q=>q.id===conn.slot);if(!c||!c.remote)return;const v=m.s;c.sx=v[0];c.sy=v[1];c.sa=v[2];c.vx=v[3];c.vy=v[4];c.last=v[5];c.fuel=v[6];c.turbos=v[7];c.turboT=v[8];c.lvl=v[10];c.brake=v[11];if(c.gx===undefined){c.x=v[0];c.y=v[1];c.a=v[2];c.gx=1;}if(v[9]&&!c.done){c.done=true;c.fin=++race.finCount;}if(m.k)for(const i of m.k)if(items[i])items[i].alive=false;}}
function mpJoin(code){mpLoadLib(()=>{let peer;try{peer=new Peer();}catch(e){MP.status='ERREUR RÉSEAU';return;}MP.peer=peer;MP.status='CONNEXION À '+code+'...';
 peer.on('open',()=>{const conn=peer.connect('nitro89-'+code,{reliable:true,serialization:'json'});MP.conn=conn;conn.on('open',()=>{conn.send(Object.assign({t:'hello'},mpMe()));});conn.on('data',mpGuestMsg);conn.on('close',mpLost);conn.on('error',mpLost);});
 peer.on('error',e=>{MP.status=e.type==='peer-unavailable'?'CODE INCONNU : '+code:'ERREUR RÉSEAU : '+String(e.type||'').toUpperCase();});});}
function mpGuestMsg(m){if(!m||!m.t)return;
 if(m.t==='welcome'){MP.on=true;MP.host=false;MP.slot=m.slot;MY=m.slot;MP.code=m.code||'';MP.status='';setState('lobby');beep(880,.08);}
 else if(m.t==='full')MP.status='PARTIE COMPLÈTE OU DÉJÀ LANCÉE';
 else if(m.t==='lobby'){MP.players=m.players;MP.ci=m.ci;MP.ri=m.ri;MP.diff=m.diff;if(m.code)MP.code=m.code;if(state==='results'&&results&&results.mp&&m.back)setState('lobby');}
 else if(m.t==='start'){MP.players=m.players;MP.ci=m.ci;MP.ri=m.ri;MP.diff=m.diff;mpStartRace();}
 else if(m.t==='st'){if(state==='race')mpApply(m);}
 else if(m.t==='end'){if(state==='race'){race.mpOrder=m.order;race.mpTimes=m.times;if(!race.over){race.over=true;race.endT=70;}}}
 else if(m.t==='bye')mpLost();}
function mpLost(){if(!MP.on&&!MP.conn&&!MP.peer)return;const was=MP.on;mpLeave();MP.status=was?'CONNEXION PERDUE AVEC L\'HÔTE':'CONNEXION IMPOSSIBLE';paused=false;stopEngine();startRace(true);setState('mpmenu');}
function mpLeave(){try{if(MP.host)mpBroadcast({t:'bye'});}catch(e){}const p=MP.peer;MP.on=false;MP.host=false;MP.conns=[];MP.conn=null;MP.peer=null;MY=0;MP.players=[null,null,null,null];MP.code='';setTimeout(()=>{try{p&&p.destroy();}catch(e){}},300);}
function mpLaunch(){if(!MP.host)return;mpBroadcast({t:'start',players:MP.players,ci:MP.ci,ri:MP.ri,diff:MP.diff});mpStartRace();}
function mpStartRace(){P={champ:MP.ci,race:MP.ri,money:0,lives:3,level:0,up:{eng:2,acc:2,tyr:2,tank:2,tur:1},pts:[0,0,0,0],earned:0,free:true,mp:true,diff:MP.diff};paused=false;startRace(false);race.goT=null;setState('race');beep(660,.1);}
function mpSnapshot(){const d=[];for(let i=0;i<items.length;i++)if(!items[i].alive)d.push(i);mpBroadcast({t:'st',cd:race.cd,c:cars.map(c=>[c.id,Math.round(c.x*10)/10,Math.round(c.y*10)/10,Math.round(c.a*1000)/1000,Math.round(c.vx*100)/100,Math.round(c.vy*100)/100,c.last,Math.round(c.fuel),c.turbos,c.turboT,c.done?1:0,c.fin||0,c.lvl||0,c.brake?1:0]),d});}
function mpApply(m){if(Math.abs(race.cd-m.cd)>6)race.cd=m.cd;for(const s of m.c){const c=cars.find(q=>q.id===s[0]);if(!c)continue;
 if(c.id===MY){if(s[11])c.fin=s[11];}
 else{c.sx=s[1];c.sy=s[2];c.sa=s[3];c.vx=s[4];c.vy=s[5];c.last=s[6];c.fuel=s[7];c.turbos=s[8];c.turboT=s[9];c.done=!!s[10];c.fin=s[11];c.lvl=s[12];c.brake=s[13];if(c.gx===undefined){c.x=s[1];c.y=s[2];c.a=s[3];c.gx=1;}}}
 for(const i of m.d)if(items[i])items[i].alive=false;}
function mpGhost(c){if(c.sx===undefined)return;c.x+=c.vx;c.y+=c.vy;c.sx+=c.vx;c.sy+=c.vy;c.x+=(c.sx-c.x)*.22;c.y+=(c.sy-c.y)*.22;c.a+=wrapA(c.sa-c.a)*.3;if(c.turboT>0)c.turboT--;}
function mpRemoteCtl(c){const m=c.rin||{};c.steer=+m.s||0;c.gas=m.g?1:0;c.brake=m.b?1:0;c.tgt=(m.tg==null)?null:+m.tg;c.assist=false;if(m.tb!==undefined&&m.tb!==c.tbSeen){if(c.tbSeen!==undefined)useTurbo(c);c.tbSeen=m.tb;}}
function mpHostTick(){if(race.cd<=0&&race.goT==null)race.goT=race.t;if(frame%3===0)mpSnapshot();if(race.over||race.cd>0)return;const hs=cars.filter(c=>c.human);
 for(const c of hs){if(c.done&&c.ft==null)c.ft=race.t-(race.goT||0);if(!c.done&&c.fuel<=0&&Math.hypot(c.vx,c.vy)<.1){c.outT=(c.outT||0)+1;if(c.outT>90)c.outF=true;}else c.outT=0;}
 if(hs.some(c=>c.done)&&!race.mpFirst)race.mpFirst=race.t;
 if(hs.length&&(hs.every(c=>c.done||c.outF)||(race.mpFirst&&race.t-race.mpFirst>60*25))){const ord=rankOf(),out=ord.filter(c=>c.outF&&!c.done),o2=ord.filter(c=>!out.includes(c)).concat(out);race.mpOrder=o2.map(c=>c.id);race.mpTimes=o2.map(c=>c.done&&c.ft!=null?c.ft:0);race.over=true;race.endT=90;mpBroadcast({t:'end',order:race.mpOrder,times:race.mpTimes});}}
function mpGuestTick(){const pl=player();if(MP.conn&&MP.conn.open&&frame%2===0){const m={t:'me',s:[Math.round(pl.x*10)/10,Math.round(pl.y*10)/10,Math.round(pl.a*1000)/1000,Math.round(pl.vx*100)/100,Math.round(pl.vy*100)/100,pl.last,Math.round(pl.fuel),pl.turbos,pl.turboT,pl.done?1:0,pl.lvl||0,pl.brake?1:0]};if(MP.picks&&MP.picks.length){m.k=MP.picks;MP.picks=[];}try{MP.conn.send(m);}catch(e){}}}
function mpFinish(){stopEngine();const ord=race.mpOrder||rankOf().map(c=>c.id);results={mp:true,free:true,order:ord,times:race.mpTimes||[],pos:ord.indexOf(MY),name:race.name,champ:P.champ,n:P.race+1};resultBtns=[];setState('results');}
function drawMPResults(){drawWorld();uiT();ctx.fillStyle='rgba(0,0,20,0.75)';ctx.fillRect(0,0,W,H);const r=results;txt('RESULTS',W/2,6,'#fff',{sc:1.8,al:'c',ol:1,rows:CHROME});txt(r.name,W/2,24,'#9cc4ff',{al:'c',sc:.85});

  txt(drvName(id)+(hum?'':' (IA)'),bx+56,y+(rh-4)/2-4,me?'#ffe23a':'#fff',{sc:fitSc(drvName(id)+' (IA)',bw-130,.95)});const t=r.times[i];txt(t?fmtT(t):(hum?'—':''),bx+bw-6,y+(rh-4)/2-4,'#8aff8a',{al:'r',sc:.85});y+=rh;});
 const by=Math.min(H-24,y+6);resultBtns=[];menuBtn(resultBtns,bx,by,bw,17,'BACK TO LOBBY','#1a7a32','ok');}

 const bw=Math.min(W-30,230),bx=(W-bw)/2;let y=Math.max(32,H*.14);const spr=carSpriteM(playerCar(),false);ctx.save();ctx.translate(W/2,y+14);ctx.rotate(-Math.PI/2);ctx.scale(1.6,1.6);ctx.drawImage(spr.c,-16,-16,32,32);ctx.restore();txt(PCFG.name,W/2,y+32,'#ffe23a',{al:'c',ol:1});y+=48;
 mpRects=[];for(const[k,l,c]of[['host','HOST GAME','#1a7a32'],['join','JOIN GAME','#1a5ac8'],['pilot','DRIVER','#1a7a7a']]){menuBtn(mpRects,bx,y,bw,19,l,c,k);y+=24;}
 txt('2 À 4 JOUEURS · LES PLACES VIDES SONT PRISES PAR L\'IA',W/2,y+2,'#c8d0ff',{al:'c',sc:fitSc('2 À 4 JOUEURS · LES PLACES VIDES SONT PRISES PAR L\'IA',W-12,.75)});if(MP.status)txt(MP.status,W/2,y+14,'#ff9a5a',{al:'c',sc:fitSc(MP.status,W-10,.8)});}

 txt('LOBBY',W/2,5,'#fff',{sc:1.5,al:'c',ol:1,rows:ICE});const code=MP.code||'....';const cw=Math.min(W-20,170),cx=(W-cw)/2;panel(cx,22,cw,22,'#0a0c18');ctx.strokeStyle='#40e0ff';ctx.lineWidth=1;rr(ctx,cx,22,cw,22,3);ctx.stroke();txt('CODE  '+code.split('').join(' '),W/2,27,'#40e0ff',{al:'c',sc:1.25,ol:1});

 for(let s=0;s<4;s++){const pl=MP.players[s],y=y0+s*rh;panel(x0,y,colW,rh-3,pl?(s===MY?'#5a3a10':'#252a44'):'#15182a');if(pl){const spr=carSpriteM(pl.car||rivalCar(0,1),false);ctx.save();ctx.translate(x0+14,y+(rh-3)/2);ctx.rotate(-Math.PI/2);ctx.scale(.55,.55);ctx.drawImage(spr.c,-16,-16,32,32);ctx.restore();txt(pl.name,x0+28,y+(rh-3)/2-4,s===MY?'#ffe23a':'#fff',{sc:fitSc(pl.name,colW-90,.9)});txt(s===0?'HOST':s===MY?'YOU':'READY',x0+colW-6,y+(rh-3)/2-4,s===0?'#ffd23a':'#8aff8a',{al:'r',sc:.75});}
  else txt(frame%60<40?'EN ATTENTE... (IA)':'',x0+colW/2,y+(rh-3)/2-4,'#6a7090',{al:'c',sc:.8});}
 const sx=land?x0+colW+10:x0,sy=land?y0:y0+4*rh+4,sw=colW,C=CHAMPS[MP.ci],ck=C.circuits[MP.ri];const rowsS=[['CHAMPIONNAT',C.short,'c'],['CIRCUIT',(MP.ri+1)+'. '+ck[0],'r'],['DIFFICULTÉ',DIFF[MP.diff].n,'d']];
 rowsS.forEach(([lab,val,k],i)=>{const y=sy+i*rh;panel(sx,y,sw,rh-3,'#252a44');txt(lab,sx+5,y+2,'#a8b0d0',{sc:.6});txt(val,sx+sw/2,y+(rh-3)/2-2,'#fff',{al:'c',sc:fitSc(val,sw-50,.85)});if(MP.host){txt('<',sx+8,y+(rh-3)/2-4,'#ffe23a');txt('>',sx+sw-8,y+(rh-3)/2-4,'#ffe23a',{al:'r'});lobRects.push({x:sx,y,w:sw*.3,h:rh-3,k,d:-1},{x:sx+sw*.7,y,w:sw*.3,h:rh-3,k,d:1});}});

 menuBtn(lobRects,sx,Math.min(by,H-20),bw,16,'LEAVE LOBBY','#7a1a1a','quit');if(MP.host&&MP.players.filter(Boolean).length<2)txt('PARTAGE LE CODE AVEC TES AMIS',W/2,H-9,'#c8d0ff',{al:'c',sc:.7});}
function lobbyAct(r){if(r.k==='quit'){mpLeave();setState('mpmenu');return;}if(!MP.host)return;if(r.k==='go'){mpLaunch();return;}
 if(r.k==='c'){MP.ci=(MP.ci+CHAMPS.length+r.d)%CHAMPS.length;MP.ri=0;}else if(r.k==='r')MP.ri=(MP.ri+10+r.d)%10;else if(r.k==='d')MP.diff=(MP.diff+(hcUnlocked?4:3)+r.d)%(hcUnlocked?4:3);beep(500,.04);mpBroadcast(mpLobbyMsg());}

function loop(now){try{musicTick();}catch(e){}const dtF=now-last;accT+=Math.min(100,dtF);last=now;if(state==='race'&&!paused&&race&&!race.demo&&race.cd<=0){perfS+=Math.min(100,dtF);perfN++;if(perfN>=240){if(perfS/perfN>21&&RES>2){QMAX=RES-1;resize();}perfN=0;perfS=0;}}
 let stepped=0;if(accT>70)accT=70;while(accT>=15.5){accT-=1000/60;stepped++;stT++;if(state==='race'&&(!paused||MP.on))stepRace();else if(state==='title'||state==='champsel'||state==='champend'||state==='freesel'||state==='records')stepRace();else frame++;}
 if(!stepped){if(WD&&cars.length&&state!=='intro'&&!paused){try{const v=viewRect(),pl=player()||cars[0];prefetch(v[0],v[1],pl.vx,pl.vy,110,1.1);}catch(e){}}requestAnimationFrame(loop);return;}
 if(state==='race')drawRace();else if(state==='intro')drawIntro();else if(state==='story')drawStory();else if(state==='title'){drawTitle();drawArcadeFoot();}else if(state==='results')drawResults();else if(state==='shop'){drawShop();drawShopSave();}else if(state==='champsel')drawChampSel();else if(state==='champend')drawChampEnd();else if(state==='freesel')drawFreeSel();else if(state==='records')drawRecords();else if(state==='pilot')drawPilot();else if(state==='mode'){drawMode();if(credits){drawArcadeFoot();if(frame%60<40)txt('PRESS START',W/2,H-9,'#ffe23a',{al:'c',sc:.8});}}else if(state==='mpmenu')drawMPMenu();else if(state==='lobby')drawLobby();else if(state==='loading')drawLoading();else if(state==='hiscore')drawHiscore();else drawGameOver();
 requestAnimationFrame(loop);}
