const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const hash=i=>{const s=Math.sin(i*12.9898+78.233)*43758.5453;return s-Math.floor(s)};
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}}
function rr(g,x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath();}
function circ(g,x,y,r){g.beginPath();g.arc(x,y,r,0,TAU);}

function emo(ch,size,white){
  const k=(white?'W':'')+ch+'|'+size;let c=ecache[k];
  if(!c){c=document.createElement('canvas');const s=Math.ceil(size*1.35),m=3;
    c.width=c.height=s*m;const g=c.getContext('2d');g.scale(m,m);
    g.font=size+'px '+EFONT;g.textAlign='center';g.textBaseline='middle';
    g.fillText(ch,s/2,s/2+size*0.06);
    if(white){g.globalCompositeOperation='source-in';g.fillStyle='#fff';g.fillRect(0,0,s,s);}
    c._s=s;ecache[k]=c;}
  return c;
}
function drawE(ch,x,y,size,rot,alpha,g,white){
  g=g||ctx;const c=emo(ch,size,white),s=c._s;
  const pa=g.globalAlpha;if(alpha!==undefined)g.globalAlpha=pa*alpha;
  if(rot){g.save();g.translate(x,y);g.rotate(rot);g.drawImage(c,-s/2,-s/2,s,s);g.restore();}
  else g.drawImage(c,x-s/2,y-s/2,s,s);
  g.globalAlpha=pa;
}
const FONT='ui-rounded,"SF Pro Rounded","Nunito",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif';
function txt(t,x,y,size,col,align,weight,stroke,g){

function glowSpr(rgb){let c=gcache[rgb];if(!c){c=document.createElement('canvas');c.width=c.height=64;const g=c.getContext('2d');

  g.fillStyle=gr;g.fillRect(0,0,64,64);gcache[rgb]=c;}return c;}
function drawGlow(x,y,r,rgb,a,g){g=g||ctx;const pa=g.globalAlpha;g.globalAlpha=pa*(a===undefined?1:a);g.drawImage(glowSpr(rgb),x-r,y-r,r*2,r*2);g.globalAlpha=pa;}

// ================= audio =================
let actx=null,muted=false,lastKillSnd=0,lastTick=0;
function ensureAudio(){
  if(!actx){try{actx=new (window.AudioContext||window.webkitAudioContext)();}catch(e){actx=null;}}
  if(actx&&actx.state==='suspended'){try{actx.resume();}catch(e){}}
}
function snd(f,d,type,v,slide){
  if(!actx||muted)return;
  try{const t=actx.currentTime,o=actx.createOscillator(),g=actx.createGain();
    o.type=type||'square';o.frequency.setValueAtTime(f,t);
    if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f*slide),t+d);
    g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(v||0.05,t+0.008);g.gain.exponentialRampToValueAtTime(0.0001,t+d);
    o.connect(g);g.connect(actx.destination);o.start(t);o.stop(t+d+0.03);}catch(e){}
}
const PROG=[0,7,9,5];
function music(){
  if(muted||!actx)return;
  const bossM=state==='boss'||state==='warn',step=bossM?7:9;if(frame%step)return;
  const n=(frame/step)|0,s=n%16,bar=(n>>4)%4,root=L.root*Math.pow(2,(bossM?[0,-2,-4,-5][bar]:PROG[bar])/12);
  if(s%4===0||s===6||s===14)snd(root,.17,'triangle',.045);
  if(s%2===0){const arp=(bossM?[0,3,7,12,7,3,0,7]:[0,4,7,12,7,4,9,7])[s/2];snd(root*2*Math.pow(2,arp/12),.08,'square',.011);}
  if(s%4===2)snd(5200,.025,'square',.005);
}

function spawnEnemy(def,x,y,o){
  o=o||{};
  if(!o.mid){if(enemies.length>40)return null;
    if(def.size&&enemies.filter(e=>e.def.size).length>=D.heavy)return null;
    if(def.mv==='hover'&&enemies.filter(e=>e.mv==='hover').length>=D.hover)return null;}
  const sz=o.mid?80:(def.size||34),p=prog();
  const e={def,x:x!==undefined?x:rand(30,W-30),y:y!==undefined?y:-30,
    hp:def.hp*(1+lvl*0.18)*D.hp*(0.8+0.4*p)*(o.mid?4.2:1),sp:def.sp*(1+lvl*0.07),mv:def.mv,t:0,size:sz,r:sz*0.42,
    shootCd:rand(40,def.rate||999),flash:0,vx:Math.random()<.5?-2:2,ty:o.mid?150:rand(90,280),hoverT:o.mid?1e9:rand(300,480),mid:!!o.mid,shots:0};
  e.max=e.hp;e.x0=e.x;enemies.push(e);return e;
}
function spawnObstacle(){
  if(obs.length>8)return;const d=pickW(L.obstacles),hp=d.hp*(1+lvl*0.15);
  obs.push({d,x:rand(40,W-40),y:-40,hp,max:hp,size:d.size,r:d.size*0.4,vy:2+(d.sp||0),flash:0});
}
function formation(pool){
  const c=pool.filter(e=>!e.size);const def=c[Math.floor(Math.random()*c.length)],n=5,v=Math.random()<.5;
  const cx=W/2+rand(-90,90);
  for(let i=0;i<n;i++){if(v)spawnEnemy(def,60+i*70,-30-Math.abs(i-2)*35);else spawnEnemy(def,cx,-30-i*45);}
}
function rush(pool){
  const c=pool.filter(e=>!e.size&&e.mv!=='hover');const def=c[Math.floor(Math.random()*c.length)];
  const left=Math.random()<.5,n=Math.max(4,Math.round(lerp(6,9+lvl,prog()))+D.rushN);
  for(let i=0;i<n;i++)spawnEnemy(def,left?30+i*(W-60)/(n-1):W-30-i*(W-60)/(n-1),-30-i*22);
  banner={t:'⚠️ VAGUE !',life:50,c:'#ffb020'};snd(330,.25,'square',.04,1.5);
}
function shootE(x,y,ang,sp,em){
  if(eb.length>320)return;
  const b={x,y,vx:Math.cos(ang)*sp,vy:Math.sin(ang)*sp,r:6,rot:0,vr:rand(-.15,.15),t:0};
  if(em.startsWith('TXT:')){b.txt=em.slice(4);b.r=9;b.vr=0;}else b.e=em;
  eb.push(b);
}
function enemyShoot(e){
  const d=e.def,em=d.shoot||L.eb,sp=(2.5+lvl*0.28)*(0.9+0.2*prog())*D.bspd,a=angTo(e,P),y=e.y+12;
  let pat=d.pat||'aim';if(e.mid){pat=[d.pat,'tri','burst'][e.shots%3];}
  e.shots++;e.kick=6;
  switch(pat){
    case 'aim':shootE(e.x,y,a,sp+0.6,em);break;
    case 'tri':for(let i=-1;i<=1;i++)shootE(e.x,y,a+i*0.22,sp,em);break;
    case 'fan':for(let i=-2;i<=2;i++)shootE(e.x,y,PI/2+i*0.28,sp*0.9,em);break;
    case 'ring':{const n=10+lvl;for(let i=0;i<n;i++)shootE(e.x,e.y,i/n*TAU+e.t*0.07,sp*0.8,em);break;}
    case 'burst':for(let i=0;i<4;i++)shootE(e.x,y,a+rand(-0.12,0.12),sp*(0.8+i*0.18),em);break;
  }
}
const MSGS=[[.25,'Ça se corse !'],[.75,'Dernière ligne droite !']];
function director(p){
  if(!mid.done&&!mid.on&&p>=0.5){
    const def=L.enemies[4];mid.on=true;mid.ref=spawnEnemy(def,W/2,-60,{mid:true});
    banner={t:'⚠️ '+L.mid+' !',life:110,c:'#ff4d6d',s:17};snd(160,.5,'square',.06);shake=8;
  }
  if(!mid.on)lvT++;
  if(msgI<MSGS.length&&p>=MSGS[msgI][0]){banner={t:MSGS[msgI][1],life:90,c:'#ffd84a'};msgI++;}
  const pool=L.enemies.filter(e=>e.at<=p);
  spawnCd-=mid.on?0.35:1;
  if(spawnCd<=0){
    if(Math.random()<0.08+0.16*p)formation(pool);

function spawnBoss(){const b=L.boss,hp=b.hp*D.bossHp;boss={x:W/2,y:-90,ty:150,r:46,hp,max:hp,def:b,t:0,patI:0,patT:0,flash:0,ready:false,phase:0,inv:0,dying:0};}
function updBoss(){
  const b=boss;b.t++;if(b.flash>0)b.flash--;
  if(b.dying){b.dying++;if(b.dying%7===0){boom(b.x+rand(-50,50),b.y+rand(-45,45),rand(.7,1.3));snd(rand(120,300),.2,'sawtooth',.05,.4);shake=8;}
    if(b.dying>95)finishBoss();return;}
  if(!b.ready){b.y+=1.6;if(b.y>=b.ty){b.y=b.ty;b.ready=true;}return;}
  const ph=b.hp<b.max*0.33?2:b.hp<b.max*0.66?1:0;
  if(ph>b.phase){b.phase=ph;b.inv=80;b.patT=0;b.patI++;bulletsToStars();shake=14;flash=8;
    banner={t:'PHASE '+(ph+1)+' !',life:80,c:'#ff4d6d',s:26};snd(140,.5,'sawtooth',.07,.5);
    boom(b.x,b.y,1.8);dropItem(b.x,b.y+30,true);}
  if(b.inv>0){b.inv--;return;}
  b.x=W/2+Math.sin(b.t*(0.012+ph*0.003))*(W/2-70);
  b.y=b.ty+Math.sin(b.t*0.03)*(14+ph*10);
  const pats=b.def.pats;
  b.patT++;if(b.patT>230){b.patT=0;b.patI++;}
  const pat=pats[b.patI%pats.length],k=[1,.82,.66][ph]*D.bossRate,sp=(2.5+lvl*0.22)*D.bspd,t=b.patT,em=b.def.bullet,by=b.y+30;
  const every=n=>t%Math.max(2,Math.floor(n*k))===0;
  if(t<24)return;
  if(pat==='aimed'&&every(38)){const a=angTo({x:b.x,y:by},P);for(let i=-1;i<=1;i++)shootE(b.x,by,a+i*0.16,sp+1,em);if(ph)shootE(b.x,by,a,sp+2.2,em);}
  if(pat==='spread'&&every(52)){const n=7+ph;for(let i=0;i<n;i++)shootE(b.x,by,PI/2+(i-(n-1)/2)*0.22,sp,em);}
  if(pat==='ring'&&every(62)){const n=12+lvl*2,off=t*0.05;for(let i=0;i<n;i++)shootE(b.x,b.y,off+i/n*TAU,sp*0.85,em);}
  if(pat==='rain'&&every(11)){shootE(b.x+rand(-45,45),by,PI/2+rand(-0.7,0.7),sp*rand(0.8,1.15),em);}
  if(pat==='spiral'&&every(6)){const a=t*0.19;shootE(b.x,b.y,a,sp*0.8,em);if(ph)shootE(b.x,b.y,a+PI,sp*0.8,em);}
  if(pat==='wall'&&every(95)){const gx=rand(50,W-50);for(let x=13;x<W;x+=25)if(Math.abs(x-gx)>40)shootE(x,64,PI/2,sp*0.62,em);}
  if(b.t%150===0){const pool=L.enemies.filter(e=>!e.size);spawnEnemy(pool[Math.floor(Math.random()*pool.length)],rand(40,W-40),-30);}
}

// ================= update =================
const keys={};
function update(){
  frame++;
  if(paused)return;
  if(slow>0){slow--;if(frame%2)return;}
  if(shake>0){shake*=0.88;if(shake<0.3)shake=0;}
  if(flash>0)flash--;
  if(banner){banner.life--;if(banner.life<=0)banner=null;}
  stT++;
  if(state==='title'||state==='over'||state==='win'){updFx();return;}
  music();
  const p=prog();
  scroll+=state==='boss'?1.2:1.8+0.8*p;
  if(state==='intro'&&stT>140){state='play';stT=0;}
  if(state==='play')director(p);
  if(state==='warn'&&stT>150){spawnBoss();state='boss';stT=0;}
  if(state==='boss'&&boss){updBoss();if(boss&&boss.ready&&!boss.dying){obsCd--;if(obsCd<=0){spawnObstacle();obsCd=rand(150,230)*D.obs;}}}
  if(state==='clear'&&stT>900){nextLevel();return;}

  // player
  const ks=5;
  if(keys.ArrowLeft||keys.a||keys.q)P.x-=ks;
  if(keys.ArrowRight||keys.d)P.x+=ks;
  if(keys.ArrowUp||keys.w||keys.z)P.y-=ks;
  if(keys.ArrowDown||keys.s)P.y+=ks;
  P.x=clamp(P.x,16,W-16);P.y=clamp(P.y,80,H-30);
  P.tilt=lerp(P.tilt,clamp((P.x-P.px)*0.06,-0.3,0.3),0.25);P.px=P.x;
  if(P.inv>0)P.inv--;if(P.shield>0)P.shield--;if(P.rapid>0)P.rapid--;if(P.muzzle>0)P.muzzle--;
  if(comboT>0){comboT--;if(comboT<=0)combo=0;}
  P.fireCd--;
  const bossDying=boss&&boss.dying;
  if(P.fireCd<=0&&state!=='clear'&&!bossDying){fire();P.fireCd=P.rapid>0?5:9;}

  // player bullets
  for(const s of pb){
    if(s.home){
      let tgt=null,bd=1e9;
      if(boss&&boss.ready&&!boss.dying){tgt=boss;bd=Math.hypot(s.x-boss.x,s.y-boss.y);}
      for(const e of enemies){const d=Math.hypot(s.x-e.x,s.y-e.y);if(d<bd&&e.y>0){bd=d;tgt=e;}}
      if(tgt){const a=angTo(s,tgt),ca=Math.atan2(s.vy,s.vx);let da=a-ca;while(da>PI)da-=TAU;while(da<-PI)da+=TAU;
        const na=ca+clamp(da,-0.12,0.12);s.vx=Math.cos(na)*7.5;s.vy=Math.sin(na)*7.5;}
      else s.vy-=0.2;
    }
    s.x+=s.vx;s.y+=s.vy;
  }
  const spark=s=>{if(parts.length<380&&Math.random()<.5)parts.push({k:'glow',x:s.x,y:s.y,vx:rand(-1.5,1.5),vy:rand(.5,3),life:9,max:9,c:'200,230,255',s:6});};

  // obstacles
  for(const o of obs){
    o.y+=o.vy;if(o.flash>0)o.flash--;
    for(const s of pb){if(!s.dead&&Math.abs(s.x-o.x)<o.r+s.r&&Math.abs(s.y-o.y)<o.r+s.r){s.dead=true;o.hp-=s.dmg;o.flash=3;spark(s);}}
    if(o.hp<=0&&!o.dead){o.dead=true;addScore(200,o.x,o.y);boom(o.x,o.y,1.3,['#8a6a4a','#ccc','#fff','#ffd84a']);
      if(frame-lastKillSnd>4){snd(160,.14,'sawtooth',.04,.5);lastKillSnd=frame;}dropItem(o.x,o.y,Math.random()<0.2);}
    if(!o.dead&&Math.abs(P.x-o.x)<o.r+P.r+2&&Math.abs(P.y-o.y)<o.r+P.r+2){if(P.shield>0)o.hp-=2;else hurt();}
  }
  obs=obs.filter(o=>!o.dead&&o.y<H+60);

  // enemies
  const fireMul=lerp(1.4,0.85,p)*Math.max(0.6,1-lvl*0.06)*D.fire;
  for(const e of enemies){
    e.t++;if(e.flash>0)e.flash--;if(e.kick>0)e.kick--;
    if(e.mv==='straight')e.y+=e.sp;
    else if(e.mv==='sine'){e.y+=e.sp;e.x=e.x0+Math.sin(e.t*0.045)*55;}
    else if(e.mv==='zigzag'){e.y+=e.sp;e.x+=e.vx;if(e.x<24||e.x>W-24)e.vx*=-1;}
    else if(e.mv==='dive'){if(e.t<45)e.y+=e.sp*0.5;else{e.y+=e.sp*1.35;e.x+=clamp((P.x-e.x)*0.035,-2.4,2.4);}}
    else if(e.mv==='hover'){
      if(e.t>e.hoverT)e.y+=e.sp*2;
      else if(e.y<e.ty)e.y+=Math.max(0.6,e.sp*1.6);
      else{e.x+=e.vx*(e.mid?0.75:0.6);if(e.x<(e.mid?50:30)||e.x>W-(e.mid?50:30))e.vx*=-1;e.y+=Math.sin(e.t*0.05)*0.4;}
    }
    if(e.def.rate&&e.y>20&&e.y<H*0.72&&state!=='clear'){e.shootCd--;if(e.shootCd<=0){enemyShoot(e);e.shootCd=e.def.rate*rand(.75,1.15)*fireMul*(e.mid?0.6:1);}}
    for(const s of pb){if(!s.dead&&Math.hypot(s.x-e.x,s.y-e.y)<e.r+s.r){s.dead=true;e.hp-=s.dmg;e.flash=4;spark(s);}}
    if(e.hp<=0&&!e.dead){e.dead=true;killEnemy(e);}
    if(!e.dead&&Math.hypot(P.x-e.x,P.y-e.y)<e.r+P.r+2){
      if(e.mid)hurt();
      else if(P.shield>0){e.dead=true;killEnemy(e);}
      else if(P.inv<=0){e.dead=true;boom(e.x,e.y,.8,['#fff']);hurt();}
    }
  }
  enemies=enemies.filter(e=>!e.dead&&e.y<H+50);

  // boss collisions
  if(boss&&boss.ready&&!boss.dying){
    for(const s of pb){if(!s.dead&&Math.hypot(s.x-boss.x,s.y-boss.y)<boss.r+s.r){s.dead=true;spark(s);if(!boss.inv){boss.hp-=s.dmg;boss.flash=3;}}}
    if(Math.hypot(P.x-boss.x,P.y-boss.y)<boss.r+P.r)hurt();
    if(boss.hp<=0){boss.dying=1;slow=50;bulletsToStars();for(const e of enemies){boom(e.x,e.y,.8);}enemies=[];for(const o of obs)boom(o.x,o.y,1);obs=[];}
  }
  pb=pb.filter(s=>s.y>-30&&s.y<H+30&&s.x>-30&&s.x<W+30&&!s.dead);

  // enemy bullets
  for(const b of eb){b.x+=b.vx;b.y+=b.vy;b.rot+=b.vr;b.t++;
    const d=Math.hypot(b.x-P.x,b.y-P.y);
    if(P.shield>0&&d<28){b.dead=true;parts.push({k:'glow',x:b.x,y:b.y,vx:0,vy:0,life:10,max:10,c:'150,240,255',s:12});continue;}
    if(d<b.r+P.r-1){b.dead=true;hurt();}
  }
  eb=eb.filter(b=>!b.dead&&b.y>-40&&b.y<H+40&&b.x>-40&&b.x<W+40);

  // items
  for(const it of items){it.t++;it.y+=1.3;it.x+=Math.sin(it.t*0.06)*0.6;
    const d=Math.hypot(it.x-P.x,it.y-P.y);
    if(d<95||state==='clear'){it.x+=(P.x-it.x)*0.08;it.y+=(P.y-it.y)*0.08;}
    if(d<24){it.dead=true;pickup(it);}
  }
  items=items.filter(i=>!i.dead&&i.y<H+30);
  // stars
  for(const s of stars){s.t++;const dx=P.x-s.x,dy=P.y-s.y,d=Math.hypot(dx,dy)||1;
    if(s.t>18&&(d<120||state==='clear'||s.t>150)){const v=Math.min(9,3+s.t*0.05);s.vx=lerp(s.vx,dx/d*v,.2);s.vy=lerp(s.vy,dy/d*v,.2);}
    else{s.vx*=0.94;s.vy=s.vy*0.94+0.14;}
    s.x+=s.vx;s.y+=s.vy;
    if(d<16){s.dead=true;score+=10*mult();if(frame-lastTick>2){snd(1300+Math.random()*300,.04,'triangle',.02);lastTick=frame;}}
  }
  stars=stars.filter(s=>!s.dead&&s.y<H+30);
  // thruster trail
  if(frame%3===0&&parts.length<380)parts.push({k:'glow',x:P.x+rand(-4,4),y:P.y+24,vx:0,vy:2.5,life:12,max:12,c:P.rapid>0?'255,180,90':'150,210,255',s:7});
  updFx();
}
function updFx(){
  for(const p of parts){p.x+=(p.vx||0);p.y+=(p.vy||0);if(p.k==='sq'){p.vy+=p.g;p.vx*=0.97;p.rot+=p.vr;}else if(p.k==='glow'){p.vx*=0.92;p.vy*=0.92;}p.life--;}
  parts=parts.filter(p=>p.life>0);
  for(const t of texts){t.y-=0.8;t.life--;}
  texts=texts.filter(t=>t.life>0);
  for(const a of amb){a.x+=a.vx+Math.sin(frame*0.02+a.ph)*0.4;a.y+=a.vy+1;if(a.y>H+10){a.y=-10;a.x=rand(0,W);}if(a.x<-10)a.x=W+10;if(a.x>W+10)a.x=-10;}
}
function nextLevel(){if(lvl+1<LEVELS.length)startLevel(lvl+1,0);else{state='win';stT=0;saveHi();}}

// ================= drawing =================
function drawStroller(x,y,sc,o){
  o=o||{};const pw=o.power||1;
  ctx.save();ctx.translate(x,y);ctx.rotate(o.tilt||0);ctx.scale(sc,sc);
  // flammes
  const fl=14+Math.sin(frame*0.9)*4+(o.rapid?6:0),fc=o.rapid?'255,170,80':'140,205,255';
  ctx.globalCompositeOperation='lighter';
  for(const fx of [-12,12]){drawGlow(fx,46,fl,fc,.9);drawGlow(fx,44,fl*0.5,'255,255,255',.9);}
  ctx.globalCompositeOperation='source-over';
  // ombre
  ctx.fillStyle='rgba(0,0,0,.22)';ctx.beginPath();ctx.ellipse(5,10,30,36,0,0,TAU);ctx.fill();
  // roues
  for(const [wx,wy] of [[-27,-20],[27,-20],[-27,18],[27,18]]){ctx.fillStyle='#1c1c22';rr(ctx,wx-4.5,wy-9,9,18,3.5);ctx.fill();

function drawWorld(){
  // fond
  const bg=getBG(lvl),off=scroll%TH;
  ctx.drawImage(bg,0,off-TH,W,TH);if(off<H)ctx.drawImage(bg,0,off,W,TH);
  ctx.fillStyle=L.tint;ctx.fillRect(0,0,W,H);
  // obstacles
  for(const o of obs){
    shadow(o.x,o.y+o.size*0.42,o.size*0.45);
    drawE(o.d.e,o.x,o.y,o.size);
    if(o.flash>0)drawE(o.d.e,o.x,o.y,o.size,0,.7,ctx,true);
    if(o.hp<o.max)hpBar(o.x,o.y-o.size*0.6,34,o.hp/o.max,'#ffb020');
  }
  // étoiles
  for(const s of stars){const z=14+Math.sin(s.t*0.3)*2;ctx.drawImage(starSpr,s.x-z,s.y-z,z*2,z*2);}
  // bonus
  for(const it of items){const b=1+Math.sin(it.t*0.12)*0.1;
    ctx.globalCompositeOperation='lighter';drawGlow(it.x,it.y,34*b,'255,220,100',.7);ctx.globalCompositeOperation='source-over';

    ctx.fillStyle='rgba(255,255,255,.85)';circ(ctx,it.x,it.y,14*b);ctx.fill();
    drawE(it.d.e,it.x,it.y,20);}
  // ennemis
  for(const e of enemies){
    const pop=Math.min(1,e.t/10),sz=e.size,bob=Math.sin(e.t*0.15)*0.08;
    shadow(e.x,e.y+sz*0.45,sz*0.36);
    if(e.mid){ctx.globalCompositeOperation='lighter';drawGlow(e.x,e.y,70+Math.sin(frame*0.2)*6,'255,60,90',.35);ctx.globalCompositeOperation='source-over';}
    const ky=e.kick?-e.kick*0.5:0;
    if(pop<1){ctx.save();ctx.translate(e.x,e.y);ctx.scale(pop,pop);drawE(e.def.e,0,0,sz,bob);ctx.restore();}
    else drawE(e.def.e,e.x,e.y+ky,sz,bob);
    if(e.flash>0)drawE(e.def.e,e.x,e.y+ky,sz,bob,.75,ctx,true);
    if(e.mid)drawE('😠',e.x+26,e.y-28,22);

  }
  // boss
  if(boss){
    const b=boss,ph=b.phase,br=1+Math.sin(b.t*0.08)*0.04;
    shadow(b.x,b.y+50,44);
    ctx.globalCompositeOperation='lighter';
    drawGlow(b.x,b.y,84+Math.sin(frame*0.15)*8,ph===2?'255,40,60':ph===1?'255,140,40':'255,220,120',.28+ph*0.1);
    ctx.globalCompositeOperation='source-over';
    const jx=b.dying?rand(-4,4):0;
    ctx.save();ctx.translate(b.x+jx,b.y);ctx.scale(br,br);ctx.rotate(Math.sin(b.t*0.05)*0.08);
    drawE(b.def.e,0,0,96);if(b.flash>0||b.dying&&b.dying%6<3)drawE(b.def.e,0,0,96,0,.7,ctx,true);ctx.restore();

    if(b.inv>0){ctx.strokeStyle='rgba(255,255,255,'+(0.4+0.4*Math.sin(frame*0.5))+')';ctx.lineWidth=3;circ(ctx,b.x,b.y,58);ctx.stroke();}

  }
  // joueur
  if(state!=='over'){

      ctx.globalCompositeOperation='lighter';drawGlow(P.x,P.y,40,'90,220,255',a*0.6);ctx.globalCompositeOperation='source-over';
      ctx.strokeStyle='rgba(150,240,255,'+a+')';ctx.lineWidth=2.5;circ(ctx,P.x,P.y,27+Math.sin(frame*0.2)*2);ctx.stroke();
      drawE('🧸',P.x+Math.cos(frame*0.08)*27,P.y+Math.sin(frame*0.08)*27,13);}
    if(!(P.inv>0&&Math.floor(P.inv/4)%2===0)){
      drawStroller(P.x,P.y,PS,{tilt:P.tilt,power:P.power,muzzle:P.muzzle>0,rapid:P.rapid>0});
      ctx.fillStyle='#fff';circ(ctx,P.x,P.y,P.r);ctx.fill();ctx.strokeStyle='#ff2d86';ctx.lineWidth=1.6;ctx.stroke();
    }
  }
  // tirs ennemis
  for(const b of eb){
    const pu=1+Math.sin(b.t*0.3)*0.12;
    if(b.txt){drawGlow(b.x,b.y,22,'255,40,90',.55);ctx.fillStyle='#fff';rr(ctx,b.x-21,b.y-9,42,18,9);ctx.fill();ctx.strokeStyle='#d0003a';ctx.lineWidth=1.6;ctx.stroke();txt(b.txt,b.x,b.y+1,10,'#a3242f');}

  }
  // particules
  for(const p of parts){

    if(p.k==='sq'){ctx.globalAlpha=Math.min(1,a*1.5);ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);ctx.fillStyle=p.c;ctx.fillRect(-p.s/2,-p.s/2,p.s,p.s*0.7);ctx.restore();ctx.globalAlpha=1;}

  }
  for(const t of texts){const pop=1+Math.max(0,(t.life-(t.max-8))/8)*0.5;ctx.globalAlpha=Math.min(1,t.life/16);txt(t.t,t.x,t.y,t.s*pop,t.c,'center','900',3);ctx.globalAlpha=1;}
  // ambiance
  if(L.amb!=='none'){for(const a of amb){
    if(L.amb==='leaf'){ctx.save();ctx.translate(a.x,a.y);ctx.rotate(frame*0.03+a.ph);ctx.fillStyle='rgba(214,130,50,.75)';ctx.beginPath();ctx.ellipse(0,0,a.s*1.3,a.s*0.6,0,0,TAU);ctx.fill();ctx.restore();}

    else{ctx.fillStyle='rgba(255,255,230,.75)';circ(ctx,a.x,a.y,a.s*0.45);ctx.fill();}
  }}
  ctx.drawImage(vignette,0,0);
}

  txt('POUSSETTE DE COMBAT',W/2,166,18,'#ffd84a','center','900',5);
  const sy=276+Math.sin(frame*0.05)*8;
  for(let i=0;i<4;i++){const yy=sy-80-((frame*5+i*45)%180);if(yy<190)continue;for(const sx of [-24,24]){drawGlow(W/2+sx,yy,10,'120,190,255',.8);ctx.fillStyle='#fff';ctx.beginPath();ctx.ellipse(W/2+sx,yy,3.5,8,0,0,TAU);ctx.fill();}}
  drawStroller(W/2,sy,1.6,{power:5,tilt:Math.sin(frame*0.03)*0.08});
  const lines=[['👆','Glisse le doigt n\'importe où pour piloter'],['⭐','Enchaîne les ennemis : combo = score ×8'],['💤','Sieste atomique : efface tous les tirs']];
  lines.forEach((l,i)=>{drawE(l[0],48,392+i*30,20);txt(l[1],68,392+i*30,13,'#eee','left','600');});
  const bx=[['🍼','Puissance'],['🥕','Tir rapide'],['🧸','Bouclier'],['💤','Sieste'],['❤️','Vie']];
  bx.forEach((b,i)=>{const x=40+i*80;ctx.fillStyle='rgba(255,255,255,.08)';circ(ctx,x,502,17);ctx.fill();drawE(b[0],x,502,20);txt(b[1],x,529,10,'#ddd','center','600');});
  txt('5 niveaux · mini-boss · boss · points de sauvegarde',W/2,556,11,'#b9a8e0','center','600');
  txt('Choisis la difficulté pour commencer',W/2,582,13,'#fff','center','800');
  diffBtns.forEach((b,i)=>{const d=DIFFS[i],sel=i===diffI;
    if(sel){ctx.globalCompositeOperation='lighter';drawGlow(b.x,b.y,70,'255,220,120',.25+0.1*Math.sin(frame*0.1));ctx.globalCompositeOperation='source-over';}
    ctx.fillStyle=sel?d.col:'rgba(255,255,255,.1)';rr(ctx,b.x-b.w/2,b.y-b.h/2,b.w,b.h,13);ctx.fill();
    ctx.strokeStyle=d.col;ctx.lineWidth=2;ctx.stroke();
    txt(d.name,b.x,b.y-4,14,sel?'#1a1030':'#fff','center','900');
    txt(d.lives+' vies',b.x,b.y+11,9,sel?'#1a1030':'#ccc','center','700');});
  if(hi>0)txt('Record : '+hi.toLocaleString('fr-FR'),W/2,660,12,'#ffd84a','center','700');
  ctx.drawImage(vignette,0,0);
}
function draw(){
  ctx.setTransform(scale*dpr,0,0,scale*dpr,0,0);
  if(state==='title'){drawTitle();return;}
  ctx.save();
  if(shake>0)ctx.translate(rand(-shake,shake)*0.5,rand(-shake,shake)*0.5);
  drawWorld();
  ctx.restore();
  drawHUD();
  drawOverlays();
  if(state==='over'){
    ctx.fillStyle='rgba(15,8,30,.82)';ctx.fillRect(0,0,W,H);
    drawE('😴',W/2,H/2-130+Math.sin(frame*0.05)*5,80);
    txt('Céleste fait la sieste…',W/2,H/2-50,26,'#ff8cc6','center','900',5);
    txt('Score : '+score.toLocaleString('fr-FR'),W/2,H/2-8,18,'#fff');
    txt('Record : '+hi.toLocaleString('fr-FR'),W/2,H/2+18,13,'#ffd84a','center','700');
    txt(cpStage===2?'Tu reprendras directement devant le boss':cpStage===1?'Tu reprendras au point de sauvegarde':'Tu reprendras au début du niveau '+(lvl+1),W/2,H/2+58,12,'#d8c8ff','center','700');
    if(stT>40&&Math.floor(frame/30)%2===0)txt('TOUCHE POUR REPRENDRE',W/2,H/2+100,16,'#fff','center','900',4);
  }
  if(state==='win'){
    ctx.fillStyle='rgba(15,8,30,.86)';ctx.fillRect(0,0,W,H);
    if(frame%8===0)boom(rand(40,W-40),rand(80,320),1.4);
    for(const p of parts){const a=Math.max(0,p.life/p.max);if(p.k==='sq'){ctx.globalAlpha=a;ctx.fillStyle=p.c;ctx.fillRect(p.x,p.y,p.s,p.s);ctx.globalAlpha=1;}else if(p.k==='ring'){ctx.strokeStyle='rgba('+p.c+','+a+')';ctx.lineWidth=p.w*a+.5;circ(ctx,p.x,p.y,lerp(p.r1,p.r0,a));ctx.stroke();}}
    drawE('👑',W/2,H/2-205+Math.sin(frame*0.06)*4,56);
    drawStroller(W/2,H/2-112,1.3,{power:5});
    txt('VICTOIRE !',W/2,H/2-10,42,'#ffd84a','center','900',6);
    txt('Céleste règne sur le quartier.',W/2,H/2+30,16,'#fff','center','700');
    txt('Score final : '+score.toLocaleString('fr-FR'),W/2,H/2+66,20,'#ff8cc6','center','900',4);
    txt('Record : '+hi.toLocaleString('fr-FR')+' · '+D.name,W/2,H/2+94,13,'#ffd84a','center','700');
    if(stT>60&&Math.floor(frame/30)%2===0)txt('TOUCHE POUR REJOUER',W/2,H/2+150,16,'#fff','center','900',4);
  }
}

// ================= input =================
let drag=null;
const inGame=()=>state==='intro'||state==='play'||state==='warn'||state==='boss'||state==='clear';
function toLocal(e){const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)/scale,y:(e.clientY-r.top)/scale};}
cv.addEventListener('pointerdown',e=>{
  e.preventDefault();ensureAudio();const p=toLocal(e);
  if(state==='title'){for(let i=0;i<3;i++){const b=diffBtns[i];if(Math.abs(p.x-b.x)<b.w/2+4&&Math.abs(p.y-b.y)<b.h/2+8){diffI=i;startGame();snd(520,.2,'triangle',.07,2);}}return;}
  if(paused){paused=false;return;}
  if(Math.hypot(p.x-muteBtn.x,p.y-muteBtn.y)<15){muted=!muted;return;}
  if(inGame()&&Math.hypot(p.x-pauseBtn.x,p.y-pauseBtn.y)<15){paused=true;return;}
  if(state==='over'){if(stT>40)continueGame();return;}
  if(state==='win'){if(stT>60){state='title';stT=0;}return;}
  if(state==='clear'){if(tally&&stT>50+30+tally.rows.length*22+35){nextLevel();return;}}
  if(Math.hypot(p.x-bombBtn.x,p.y-bombBtn.y)<bombBtn.r+8){useBomb();return;}
  drag={id:e.pointerId,x:p.x,y:p.y};
  try{cv.setPointerCapture(e.pointerId);}catch(err){}
},{passive:false});
cv.addEventListener('pointermove',e=>{
  if(!drag||drag.id!==e.pointerId||paused)return;e.preventDefault();
  const p=toLocal(e);P.x+=(p.x-drag.x)*1.35;P.y+=(p.y-drag.y)*1.35;drag.x=p.x;drag.y=p.y;
  P.x=clamp(P.x,16,W-16);P.y=clamp(P.y,80,H-30);
},{passive:false});
const endDrag=e=>{if(drag&&drag.id===e.pointerId)drag=null;};
cv.addEventListener('pointerup',endDrag);cv.addEventListener('pointercancel',endDrag);
document.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&inGame()&&state!=='clear')paused=true;});
addEventListener('keydown',e=>{
  keys[e.key]=true;ensureAudio();
  if(e.key===' '||e.key==='b'||e.key==='B'){e.preventDefault();
    if(state==='title')startGame();else if(state==='over'&&stT>40)continueGame();else if(state==='win'&&stT>60)state='title';else if(state==='clear'&&stT>150)nextLevel();else useBomb();}
  if(e.key==='Enter'){if(state==='title')startGame();else if(state==='over'&&stT>40)continueGame();}
  if(e.key==='m')muted=!muted;
  if(e.key==='p'||e.key==='Escape'){if(inGame())paused=!paused;}
  if(e.key.startsWith('Arrow'))e.preventDefault();
});
addEventListener('keyup',e=>{keys[e.key]=false;});

// ================= loop =================
let last=performance.now(),acc=0;
function loop(now){
  acc+=Math.min(100,now-last);last=now;
  let n=0;while(acc>=1000/60&&n<5){update();acc-=1000/60;n++;}
  draw();requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
