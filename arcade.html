<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#08080b" />
<title>Forge — Arcade</title>
<meta name="description" content="Forge Arcade — Neptune, Le Manoir de Mortecouille, Céleste : Poussette de combat, Templier 3188, Nitro 89, Cassinity : des jeux à lancer directement dans le navigateur, sur mobile comme sur PC." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=Limelight&family=Fredoka:wght@600;700&family=Orbitron:wght@700;900&family=Cinzel:wght@700;900&family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;1,9..144,400;1,9..144,600&family=Inter+Tight:wght@400;500;600;700&family=Monoton&family=Russo+One&display=swap" rel="stylesheet" />
<style>
  :root{
    --bg:#08080b;
    --ink:#f4f2ee;
    --ink-2:rgba(244,242,238,.72);
    --ink-3:rgba(244,242,238,.48);
    --line:rgba(244,242,238,.12);
    --gutter:clamp(18px,4.2vw,64px);
    --ease:cubic-bezier(.2,.7,.2,1);
  }
  *,*::before,*::after{box-sizing:border-box}
  html{-webkit-font-smoothing:antialiased;background:var(--bg)}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:"Inter Tight",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:15px;line-height:1.5;overflow-x:hidden}
  a{color:inherit;text-decoration:none}
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
  svg{display:block}

  /* ---------- Top bar ---------- */
  .bar{position:fixed;inset:0 0 auto 0;z-index:30;display:flex;align-items:center;justify-content:space-between;
       padding:calc(14px + env(safe-area-inset-top)) var(--gutter) 14px;
       background:linear-gradient(180deg,rgba(8,8,11,.85),rgba(8,8,11,0));transition:background .4s ease}
  .bar.solid{background:rgba(8,8,11,.94);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
  .brand{display:flex;align-items:baseline;gap:12px}
  .brand .mark{font-family:"Fraunces",serif;font-weight:300;letter-spacing:.32em;font-size:18px;text-transform:uppercase}
  .brand .sub{font-size:10px;letter-spacing:.34em;text-transform:uppercase;color:#e7c56f;font-weight:600}
  .bar nav{display:flex;gap:26px;font-size:13px;color:var(--ink-2)}
  .bar nav a:hover{color:var(--ink)}
  @media (max-width:560px){.bar nav .hide-sm{display:none}}

  /* ---------- Hero billboard ---------- */
  .hero{position:relative;height:min(88vh,860px);min-height:560px;overflow:hidden;isolation:isolate}
  .slide{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity 1s ease,visibility 0s linear 1s}
  .slide.on{opacity:1;visibility:visible;transition:opacity 1s ease}
  .slide .art{position:absolute;inset:0;z-index:-2}
  .slide .art svg{width:100%;height:100%}
  .slide.on .art svg{animation:kb 16s ease-out both}
  @keyframes kb{from{transform:scale(1.07)}to{transform:scale(1)}}
  .slide::before{content:"";position:absolute;inset:0;z-index:-1;
    background:
      linear-gradient(90deg,rgba(8,8,11,.92) 0%,rgba(8,8,11,.70) 28%,rgba(8,8,11,.15) 55%,rgba(8,8,11,0) 70%),
      linear-gradient(0deg,var(--bg) 0%,rgba(8,8,11,.55) 18%,rgba(8,8,11,0) 42%)}
  .hero-copy{position:absolute;left:var(--gutter);bottom:clamp(90px,15vh,150px);width:min(520px,calc(100% - 2*var(--gutter)))}
  .kicker{display:inline-flex;align-items:center;gap:10px;font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:var(--ink-2);font-weight:600;margin-bottom:14px}
  .kicker i{width:22px;height:2px;background:currentColor;display:block}
  .hero-title{margin:0 0 16px;line-height:.95}
  .meta{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;font-size:13px;color:var(--ink-2);margin-bottom:14px}
  .meta .hl{color:#5fe3a8;font-weight:700}
  .meta .pill{border:1px solid rgba(244,242,238,.35);border-radius:3px;padding:1px 6px;font-size:11px;letter-spacing:.06em}
  .hero-desc{font-size:clamp(15px,1.3vw,18px);color:var(--ink);margin:0 0 24px;text-shadow:0 1px 12px rgba(0,0,0,.6)}
  .ctas{display:flex;gap:12px;flex-wrap:wrap}
  .btn{display:inline-flex;align-items:center;gap:10px;height:48px;padding:0 26px 0 20px;border-radius:6px;font-weight:700;font-size:16px;transition:transform .2s var(--ease),background .2s ease}
  .btn:active{transform:scale(.97)}
  .btn svg{width:22px;height:22px}
  .btn.play{background:var(--ink);color:#0b0b0e}
  .btn.play:hover{background:#fff}
  .btn.info{background:rgba(120,120,130,.42);color:var(--ink);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
  .btn.info:hover{background:rgba(140,140,150,.6)}
  .dots{position:absolute;right:var(--gutter);bottom:clamp(96px,15.5vh,156px);display:flex;gap:8px;z-index:2}
  .dots button{width:26px;height:4px;border-radius:2px;background:rgba(244,242,238,.3);overflow:hidden;position:relative}
  .dots button span{position:absolute;inset:0;background:var(--ink);transform-origin:left;transform:scaleX(0)}
  .dots button.on span{animation:prog var(--dur,9s) linear forwards}
  .hero.paused .dots button.on span{animation-play-state:paused}
  @keyframes prog{to{transform:scaleX(1)}}

  @media (max-width:760px){
    .hero{height:auto;min-height:0;aspect-ratio:auto}
    .hero{height:min(92svh,780px)}
    .slide::before{background:linear-gradient(0deg,var(--bg) 2%,rgba(8,8,11,.88) 30%,rgba(8,8,11,.25) 58%,rgba(8,8,11,0) 75%)}
    .hero-copy{bottom:76px;text-align:center;left:50%;transform:translateX(-50%)}
    .kicker,.meta,.ctas{justify-content:center}
    .hero-desc{font-size:15px}
    .dots{left:50%;right:auto;transform:translateX(-50%);bottom:36px}
    .btn{flex:1;justify-content:center;max-width:220px}
  }

  /* ---------- Game title treatments ---------- */
  .t-nitro{font-family:"Monoton",cursive;font-weight:400;letter-spacing:.04em;color:#ffe23a;
    text-shadow:0 0 18px rgba(255,46,136,.75),0 0 42px rgba(255,106,61,.45);display:inline-flex;align-items:baseline;gap:.12em}
  .t-nitro em{font-style:normal;font-family:"Russo One",sans-serif;color:#fff;-webkit-text-stroke:0;text-shadow:3px 3px 0 #ff2e88,0 0 24px rgba(255,46,136,.8)}
  .t-cass{font-family:"Fraunces",serif;font-style:italic;font-weight:600;color:#e9c97e;letter-spacing:.01em;
    text-shadow:0 2px 24px rgba(0,0,0,.6)}
  .t-cass small{display:block;font-style:normal;font-weight:500;font-family:"Inter Tight",sans-serif;font-size:.17em;letter-spacing:.42em;text-transform:uppercase;color:#cfe3d6;margin-top:.55em}
  .t-temp{font-family:"Cinzel",serif;font-weight:900;color:#efe3c6;letter-spacing:.06em;
    text-shadow:0 0 28px rgba(192,22,31,.55),0 2px 0 #5c0a0e;display:inline-flex;flex-direction:column;line-height:.9}
  .t-temp b{font-family:"Chakra Petch",sans-serif;font-weight:700;font-size:.5em;color:#ff3b30;letter-spacing:.5em;margin-top:.2em;text-shadow:0 0 16px rgba(255,48,48,.7)}
  .t-nep{font-family:"Orbitron",sans-serif;font-weight:900;letter-spacing:.1em;color:#eafcff;display:inline-block;transform:skewX(-12deg);
    text-shadow:0 0 18px rgba(46,200,255,.85),4px 4px 0 #ff2e6e}
  .t-mort{font-family:"Limelight",serif;font-weight:400;color:#ecdcb0;letter-spacing:.02em;display:inline-flex;flex-direction:column;line-height:.95;
    text-shadow:0 2px 0 #3a1a12,0 0 26px rgba(242,181,68,.28)}
  .t-mort small{font-family:"Cinzel",serif;font-weight:700;font-size:.27em;letter-spacing:.42em;color:#d8b25a;text-transform:uppercase;text-shadow:0 2px 10px rgba(0,0,0,.8);margin-bottom:.25em}
  .t-mort i{font-family:"Fraunces",serif;font-style:italic;font-weight:400;font-size:.26em;letter-spacing:.06em;color:#d8b25a;margin-top:.35em;text-shadow:0 2px 10px rgba(0,0,0,.8)}
  .t-pous{font-family:"Fredoka",sans-serif;font-weight:700;color:#fff;display:inline-flex;flex-direction:column;line-height:.92;
    text-shadow:0 0 20px rgba(255,126,182,.75),0 3px 0 #b0467f}
  .t-pous em{font-family:"Fredoka",sans-serif;font-style:normal;font-weight:600;color:#ffd84a;font-size:.3em;letter-spacing:.08em;text-transform:uppercase;margin-top:.3em;white-space:nowrap;text-shadow:0 0 18px rgba(255,211,110,.5),0 2px 0 #6b3d1a}
  .hero-title .t-nep{font-size:clamp(46px,7.4vw,100px)}
  .hero-title .t-mort{font-size:clamp(44px,6.2vw,86px)}
  .hero-title .t-pous{font-size:clamp(64px,8.6vw,118px)}
  .poster .ptitle .t-nep{font-size:clamp(26px,2.3vw,34px)}
  .poster .ptitle .t-mort{font-size:clamp(23px,2vw,30px)}
  .poster .ptitle .t-pous{font-size:clamp(44px,3.8vw,56px)}
  .m-head .t-nep{font-size:clamp(32px,5.6vw,60px)}
  .m-head .t-mort{font-size:clamp(32px,5.2vw,56px)}
  .m-head .t-pous{font-size:clamp(46px,7.4vw,80px)}
  .hero-title .t-nitro{font-size:clamp(46px,7vw,92px)}
  .hero-title .t-cass{font-size:clamp(56px,8vw,112px)}
  .hero-title .t-temp{font-size:clamp(46px,6.6vw,88px)}

  /* ---------- Rows ---------- */
  main{position:relative;z-index:2;margin-top:-56px;padding-bottom:40px}
  @media (max-width:760px){main{margin-top:22px}}
  .row{padding:0 var(--gutter);margin-bottom:46px}
  .row h2{font-size:clamp(18px,1.6vw,22px);font-weight:700;margin:0 0 16px;display:flex;align-items:center;gap:10px}
  .row h2 .count{font-size:12px;font-weight:600;color:var(--ink-3);letter-spacing:.08em}
  .rail-wrap{position:relative}
  .rail{display:grid;grid-auto-flow:column;grid-auto-columns:clamp(232px,23vw,300px);gap:clamp(14px,2vw,28px);scroll-behavior:smooth;scroll-padding-left:4px;
        overflow-x:auto;scroll-snap-type:x mandatory;padding:10px 4px 26px;margin:-10px -4px 0;scrollbar-width:none}
  .rail::-webkit-scrollbar{display:none}
  .arrow{position:absolute;top:0;bottom:16px;width:clamp(36px,3.6vw,56px);z-index:5;display:none;align-items:center;justify-content:center;color:var(--ink);
         background:linear-gradient(90deg,rgba(8,8,11,.9),rgba(8,8,11,0));opacity:0;transition:opacity .25s ease}
  .arrow.next{right:calc(-1*var(--gutter));background:linear-gradient(270deg,rgba(8,8,11,.92),rgba(8,8,11,0))}
  .arrow.prev{left:calc(-1*var(--gutter))}
  .arrow svg{width:34px;height:34px;transition:transform .2s var(--ease)}
  .arrow:hover svg{transform:scale(1.25)}
  @media (hover:hover){.arrow{display:flex}.rail-wrap:hover .arrow:not([disabled]){opacity:1}}
  .arrow[disabled]{pointer-events:none}
  .slot{display:flex;align-items:flex-end;scroll-snap-align:start}
  .rank{font-family:"Inter Tight",sans-serif;font-weight:700;font-size:clamp(120px,11vw,190px);line-height:.72;letter-spacing:-.06em;
        color:var(--bg);-webkit-text-stroke:3px rgba(244,242,238,.55);margin-right:-.14em;user-select:none;flex:none;position:relative;z-index:0}
  .poster{position:relative;z-index:1;flex:1;min-width:0;aspect-ratio:2/3;border-radius:8px;overflow:hidden;background:#111;
          box-shadow:0 18px 40px -18px rgba(0,0,0,.9);transition:transform .35s var(--ease),box-shadow .35s ease;outline:none;text-align:left;display:block;width:100%}
  .poster .art,.poster .art svg{position:absolute;inset:0;width:100%;height:100%}
  .poster::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,rgba(0,0,0,.92) 0%,rgba(0,0,0,.35) 32%,rgba(0,0,0,0) 52%);pointer-events:none}
  .poster .f{position:absolute;top:12px;left:12px;z-index:2;font-family:"Fraunces",serif;font-weight:500;font-size:22px;color:#e7c56f;text-shadow:0 1px 6px rgba(0,0,0,.7)}
  .poster .badge{position:absolute;top:0;right:12px;z-index:2;background:#c0161f;color:#fff;font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;padding:10px 7px 6px;border-radius:0 0 4px 4px}
  .poster .ptitle{position:absolute;left:0;right:0;bottom:62px;z-index:2;text-align:center;padding:0 14px}
  .poster .ptitle .t-nitro{font-size:clamp(26px,2.4vw,36px)}
  .poster .ptitle .t-cass{font-size:clamp(34px,3vw,46px)}
  .poster .ptitle .t-temp{font-size:clamp(26px,2.4vw,36px)}
  .poster .tag{position:absolute;left:0;right:0;bottom:22px;z-index:2;text-align:center;font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--ink-2);font-weight:600}
  .poster .hover{position:absolute;inset:0;z-index:3;display:flex;flex-direction:column;justify-content:flex-end;padding:18px;gap:10px;
                 background:linear-gradient(0deg,rgba(6,6,9,.97) 0%,rgba(6,6,9,.9) 42%,rgba(6,6,9,.35) 70%,rgba(6,6,9,0) 100%);
                 opacity:0;transform:translateY(8px);transition:opacity .3s ease,transform .3s var(--ease)}
  .poster .hover p{margin:0;font-size:13.5px;color:var(--ink-2)}
  .poster .hover .hrow{display:flex;gap:8px;align-items:center}
  .round{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;border:2px solid rgba(244,242,238,.5);background:rgba(20,20,24,.6);transition:border-color .2s,background .2s}
  .round:hover{border-color:var(--ink)}
  .round.solid{background:var(--ink);border-color:var(--ink);color:#0b0b0e}
  .round svg{width:20px;height:20px}
  .poster .hover .hname{font-weight:700;font-size:17px}
  .poster .hover .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chip{font-size:11px;font-weight:600;color:var(--ink-2);border:1px solid var(--line);border-radius:999px;padding:3px 9px;display:inline-flex;align-items:center;gap:5px}
  .chip svg{width:13px;height:13px}
  @media (hover:hover){
    .slot:hover .poster,.poster:focus-visible{transform:scale(1.045) translateY(-6px);box-shadow:0 30px 60px -20px rgba(0,0,0,.95),0 0 0 2px rgba(244,242,238,.85)}
    .slot:hover .poster .hover,.poster:focus-visible .hover{opacity:1;transform:none}
  }
  .poster:focus-visible{box-shadow:0 0 0 3px #fff}

  /* ---------- Univers strip ---------- */
  .tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(12px,1.6vw,22px)}
  @media (max-width:760px){.tiles{grid-template-columns:1fr}}
  .tile{position:relative;aspect-ratio:16/9;border-radius:8px;overflow:hidden;display:block;background:#111;transition:transform .3s var(--ease)}
  .tile .art,.tile .art svg{position:absolute;inset:0;width:100%;height:100%}
  .tile::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.85),rgba(0,0,0,.1) 70%)}
  .tile .tx{position:absolute;left:18px;bottom:16px;right:40%;z-index:2}
  .tile .tx b{display:block;font-size:17px;margin-bottom:3px}
  .tile .tx span{font-size:12.5px;color:var(--ink-2)}
  .tile:hover{transform:translateY(-3px)}
  .tile .go{position:absolute;right:16px;bottom:16px;z-index:2}

  /* ---------- Modal ---------- */
  dialog{border:0;padding:0;background:#141418;color:var(--ink);border-radius:10px;width:min(860px,calc(100% - 24px));max-height:calc(100dvh - 40px);overflow:auto;box-shadow:0 40px 120px rgba(0,0,0,.8)}
  dialog::backdrop{background:rgba(0,0,0,.72);backdrop-filter:blur(3px)}
  dialog[open]{animation:pop .35s var(--ease)}
  @keyframes pop{from{opacity:0;transform:translateY(20px) scale(.97)}to{opacity:1;transform:none}}
  .m-art{position:relative;aspect-ratio:16/9}
  .m-art > svg{position:absolute;inset:0;width:100%;height:100%}
  .m-art::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,#141418 0%,rgba(20,20,24,0) 55%)}
  .m-head{position:absolute;left:clamp(18px,4vw,44px);bottom:clamp(14px,3vw,30px);z-index:2}
  .m-head .hero-title{margin-bottom:16px}
  .m-head .t-nitro{font-size:clamp(34px,6vw,64px)}
  .m-head .t-cass{font-size:clamp(42px,7vw,78px)}
  .m-head .t-temp{font-size:clamp(32px,5.6vw,60px)}
  .m-close{position:absolute;top:14px;right:14px;z-index:3}
  .m-body{display:grid;grid-template-columns:1.7fr 1fr;gap:28px;padding:6px clamp(18px,4vw,44px) 36px}
  @media (max-width:640px){.m-body{grid-template-columns:1fr;gap:18px}}
  .m-body p{margin:0 0 12px;color:var(--ink);font-size:15.5px}
  .m-side{font-size:13.5px;color:var(--ink-3)}
  .m-side div{margin-bottom:10px}
  .m-side b{color:var(--ink-2);font-weight:500}
  .m-feats{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}

  footer{padding:30px var(--gutter) calc(40px + env(safe-area-inset-bottom));color:var(--ink-3);font-size:12.5px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}
  footer a:hover{color:var(--ink)}

  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation:none!important;transition:none!important}
  }
</style>
</head>
<body>

<header class="bar" id="bar">
  <a class="brand" href="index.html" aria-label="Forge — accueil">
    <span class="mark">Forge</span><span class="sub">Arcade</span>
  </a>
  <nav>
    <a href="#affiche">À l'affiche</a>
    <a href="#univers" class="hide-sm">Univers</a>
    <a href="index.html">Forge ↗</a>
  </nav>
</header>

<section class="hero" id="hero" aria-roledescription="carrousel" aria-label="Jeux à la une"></section>

<main>
  <section class="row" id="affiche">
    <h2>À l'affiche <span class="count" id="count"></span></h2>
    <div class="rail-wrap">
      <button class="arrow prev" aria-label="Défiler vers la gauche" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
      <div class="rail" id="rail"></div>
      <button class="arrow next" aria-label="Défiler vers la droite"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></button>
    </div>
  </section>

  <section class="row" id="univers">
    <h2>Choisir par envie</h2>
    <div class="tiles" id="tiles"></div>
  </section>
</main>

<footer>
  <span>Forge Arcade · Jeux jouables directement dans le navigateur — iPhone, Android, PC.</span>
  <a href="index.html">← Retour à Forge</a>
</footer>

<dialog id="modal" aria-label="Fiche du jeu"></dialog>

<script>
/* ============================================================
   CATALOGUE — pour ajouter un jeu : un objet de plus ici + une
   fonction de scène (ou réutiliser une existante).
   ============================================================ */
const GAMES = [
  {
    id: "neptune",
    url: "neptune.html",
    title: '<span class="t-nep">NEPTUNE</span>',
    name: "Neptune",
    genre: "Course anti-gravité",
    tagline: "Vitesse terminale",
    year: "2026",
    badge: "Nouveauté",
    short: "Trente circuits, six coupes, cinq machines. Inclinez l'iPhone pour piloter votre bolide anti-gravité, de Port Azur jusqu'au fond de la Fosse des Mariannes.",
    long: [
      "Lave qui vide votre énergie, verglas au bord du vide, mines sur la piste, tempêtes de sable et portes coulissantes. Chaque circuit a son piège, et la moindre sortie de piste se paie cher.",
      "Rechargez-vous sur la bande rose, passez au garage entre deux courses et grimpez de coupe en coupe jusqu'au Trident de Neptune."
    ],
    feats: ["mobile", "pc", "solo"],
    facts: { Genre: "Course anti-gravité 3D", Contenu: "30 circuits · 6 coupes · 5 machines", Commandes: "Inclinaison de l'iPhone, tactile ou clavier" },
    univers: { label: "Envie de vitesse", sub: "Anti-gravité, boosts, sensations" },
    accent: "#2ec8ff",
    scene: neptuneScene
  },
  {
    id: "mortecouille",
    url: "mortecouille.html",
    title: '<span class="t-mort"><small>Le Manoir de</small>Mortecouille<i>— une enquête —</i></span>',
    name: "Le Manoir de Mortecouille",
    genre: "Enquête criminelle",
    tagline: "Quatre jours pour la vérité",
    year: "2026",
    badge: "Nouveauté",

  s += `<circle cx="1420" cy="140" r="120" fill="#e9dcb0" opacity=".25" filter="url(#${p}big)"/><circle cx="1420" cy="140" r="56" fill="url(#${p}moon)"/>`;
  s += `<g fill="#1a2a2c" filter="url(#${p}soft)"><ellipse cx="1330" cy="170" rx="210" ry="26" opacity=".9"/><ellipse cx="1000" cy="120" rx="260" ry="22" opacity=".7"/><ellipse cx="600" cy="200" rx="320" ry="30" opacity=".6"/></g>`;
  // Lisière d'arbres
  let tl = 'M0 610 ';
  for (let x=0;x<=1600;x+=40){ tl += `Q${x+20} ${560-r()*50} ${x+40} ${600-r()*20} `; }
  s += `<path d="${tl} L1600 900 L0 900Z" fill="#101c1d"/>`;
  // Peupliers
  for (const [x,h] of [[930,330],[985,280],[1440,310],[1495,350],[380,300],[440,260]]) s += `<ellipse cx="${x}" cy="${600-h/2}" rx="${h*.09}" ry="${h/2}" fill="#0c1617"/>`;
  // Sol
  s += `<rect x="0" y="598" width="1600" height="302" fill="url(#${p}gnd)"/>`;
  s += `<ellipse cx="1200" cy="660" rx="330" ry="50" fill="#3b3a33" opacity=".55"/>`;
  // ----- Manoir -----
  s += `<g>
    <rect x="1104" y="270" width="18" height="70" fill="#8d7f62"/><rect x="1100" y="264" width="26" height="9" fill="#5c5446"/>
    <rect x="1278" y="262" width="18" height="78" fill="#8d7f62"/><rect x="1274" y="256" width="26" height="9" fill="#5c5446"/>
    <polygon points="1050,400 1104,300 1296,300 1350,400" fill="url(#${p}slate)"/>
    <path d="M1104 300 H1296" stroke="#6a7682" stroke-width="2"/>
    <rect x="1060" y="398" width="280" height="202" fill="url(#${p}stone)"/>
    <rect x="1060" y="398" width="280" height="8" fill="#5c5446"/><rect x="1060" y="494" width="280" height="6" fill="#857a5f"/>
    <rect x="1060" y="590" width="280" height="10" fill="#4a4336"/>
  </g>`;
  // Lucarnes
  for (const x of [1135,1200,1265]) s += `<g><rect x="${x-14}" y="342" width="28" height="40" fill="#b3a27e"/><polygon points="${x-19},344 ${x},322 ${x+19},344" fill="#2a323a"/><rect x="${x-8}" y="350" width="16" height="26" fill="#1a1e22"/></g>`;
  // Tours à toit en poivrière
  for (const [x,w] of [[995,66],[1339,66]]){
    s += `<rect x="${x}" y="372" width="${w}" height="228" fill="url(#${p}tower)"/><polygon points="${x-8},374 ${x+w/2},250 ${x+w+8},374" fill="url(#${p}slate)"/><path d="M${x-8} 374 H${x+w+8}" stroke="#5c5446" stroke-width="5"/>`;
    s += `<rect x="${x+w/2-1.5}" y="222" width="3" height="32" fill="#151a1f"/>`;
    s += `<path d="M${x+w/2-10} 470 L${x+w/2-10} 445 A10 10 0 0 1 ${x+w/2+10} 445 L${x+w/2+10} 470Z" fill="#1a1e22"/>`;
  }
  s += `<path d="M1028 230 L1046 236 L1028 242Z" fill="#151a1f"/>`;
  // Fenêtres
  const win = (x,y,lit) => {
    let o = '';
    if (lit) o += `<rect x="${x-6}" y="${y-6}" width="38" height="58" fill="#f2b544" opacity=".55" filter="url(#${p}glow)"/>`;
    o += `<rect x="${x-7}" y="${y}" width="6" height="46" fill="#3b4a46"/><rect x="${x+27}" y="${y}" width="6" height="46" fill="#3b4a46"/>`;
    o += `<rect x="${x}" y="${y}" width="26" height="46" fill="${lit? '#f2b544' : '#1a1e22'}" stroke="#d8c9a3" stroke-width="2"/>`;
    o += `<path d="M${x+13} ${y} V${y+46} M${x} ${y+16} H${x+26} M${x} ${y+31} H${x+26}" stroke="${lit?'#7a4a18':'#3a3f44'}" stroke-width="1.6"/>`;
    return o; };
  const cols = [1078,1132,1186,1240,1294];
  cols.forEach((x,i)=>{ s += win(x+1,420,i===3); });
  cols.forEach((x,i)=>{ if (i!==2) s += win(x+1,526,i===0); });
  // Silhouette derrière la fenêtre éclairée
  s += `<g fill="#2a1408" opacity=".9"><circle cx="1254" cy="436" r="6"/><path d="M1245 466 Q1245 446 1254 444 Q1263 446 1263 466Z"/></g>`;
  // Porte et perron
  s += `<path d="M1186 590 L1186 548 A15 15 0 0 1 1216 548 L1216 590Z" fill="#2a1d14" stroke="#d8c9a3" stroke-width="2"/><rect x="1176" y="590" width="50" height="6" fill="#9a8c6c"/><rect x="1168" y="596" width="66" height="6" fill="#857a5f"/>`;
  s += `<circle cx="1201" cy="534" r="5" fill="#f2b544" opacity=".8" filter="url(#${p}glow)"/>`;
  // Automobile des années 30, phares allumés
  s += `<g transform="translate(905 668)">
    <path d="M60 30 L640 -20 L640 60 L60 52Z" fill="#f2d48a" opacity=".12" filter="url(#${p}soft)"/>
    <path d="M-70 30 L-70 8 Q-66 -2 -40 -4 L-20 -4 L-6 -28 Q0 -34 14 -34 L52 -34 Q62 -34 66 -24 L74 -4 L104 -2 Q120 0 122 14 L124 30 Z" fill="#0c0f10"/>
    <path d="M-2 -26 L12 -26 L12 -6 L-12 -6Z M18 -26 L54 -26 L62 -6 L18 -6Z" fill="#2a3a3c"/>
    <circle cx="-38" cy="30" r="15" fill="#050606"/><circle cx="88" cy="30" r="15" fill="#050606"/><circle cx="-38" cy="30" r="6" fill="#4a4a44"/><circle cx="88" cy="30" r="6" fill="#4a4a44"/>
    <circle cx="118" cy="8" r="7" fill="#ffe7a8"/><circle cx="118" cy="8" r="14" fill="#ffe7a8" opacity=".5" filter="url(#${p}glow)"/>
  </g>`;
  // Piliers du portail
  for (const x of [900,1500]){
    s += `<g><rect x="${x-26}" y="560" width="52" height="340" fill="#2d2a24"/><rect x="${x-26}" y="560" width="14" height="340" fill="#3d382f"/><rect x="${x-34}" y="548" width="68" height="16" fill="#3a352c"/>
      <path d="M${x-16} 548 Q${x-20} 520 ${x} 512 Q${x+20} 520 ${x+16} 548Z" fill="#2d2a24"/><rect x="${x-4}" y="502" width="8" height="12" fill="#2d2a24"/></g>`;
  }
  // Corbeau
  s += `<path d="M1504 500 q-6 -10 4 -16 q8 -4 12 4 l14 2 l-12 4 q-2 8 -12 8 q-8 0 -6 -2z" fill="#050606"/>`;
  // Grille en fer forgé basse
  s += `<g stroke="#0a0c0c" stroke-width="4">`;
  for (let x=930;x<1475;x+=22) s += `<line x1="${x}" y1="${800}" x2="${x}" y2="900"/>`;
  s += `<path d="M926 806 Q1200 770 1474 806" fill="none" stroke-width="6"/></g>`;
  // Pluie fine
  s += `<g stroke="#bcd0d0" stroke-width="1.2" opacity=".14">`;
  for (let i=0;i<150;i++){ const x=r()*1700, y=r()*900; s += `<line x1="${x.toFixed(0)}" y1="${y.toFixed(0)}" x2="${(x-10).toFixed(0)}" y2="${(y+34).toFixed(0)}"/>`; }
  s += `</g>`;
  return s;
}

/* ============ SCÈNE 6 — CÉLESTE : POUSSETTE DE COMBAT ============ */
function poussetteScene(p){
  const r = rng(777); let s = `<defs>
    <linearGradient id="${p}sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2b1f5c"/><stop offset=".5" stop-color="#9a4a8c"/><stop offset=".85" stop-color="#ff9a6b"/><stop offset="1" stop-color="#ffd27a"/></linearGradient>
    <linearGradient id="${p}road" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3a2f52"/><stop offset="1" stop-color="#16121f"/></linearGradient>
    <filter id="${p}glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="8"/></filter>
    <filter id="${p}big" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="30"/></filter>
  </defs>`;
  s += `<rect width="1600" height="900" fill="url(#${p}sky)"/>`;
  s += `<circle cx="1340" cy="560" r="160" fill="#ffe08a" opacity=".55" filter="url(#${p}big)"/>`;
  // Le quartier : immeubles, clocher, supermarché
  let x = -10;
  while (x < 1620){ const w = 70+r()*90, h = 120+r()*170, c = ['#3b2552','#462a5e','#33204a'][Math.floor(r()*3)];
    s += `<rect x="${x.toFixed(0)}" y="${(640-h).toFixed(0)}" width="${w.toFixed(0)}" height="${h.toFixed(0)}" fill="${c}"/>`;
    s += `<polygon points="${x-4},${640-h} ${x+w/2},${640-h-22} ${x+w+4},${640-h}" fill="#2a1a3c"/>`;
    for (let yy=640-h+20; yy<620; yy+=34) for (let xx=x+12; xx<x+w-16; xx+=26) if (r()<.75) s += `<rect x="${xx.toFixed(0)}" y="${yy.toFixed(0)}" width="12" height="18" fill="${r()<.35?'#ffd27a':'#5a3d72'}"/>`;
    x += w+4; }
  s += `<g fill="#2a1a3c"><rect x="560" y="330" width="60" height="310"/><polygon points="552,330 590,200 628,330"/><rect x="587" y="170" width="6" height="34"/><rect x="578" y="180" width="24" height="5"/></g>`;
  s += `<rect x="0" y="636" width="1600" height="18" fill="#2a1a3c"/>`;
  s += `<rect x="0" y="652" width="1600" height="248" fill="url(#${p}road)"/>`;
  s += `<g stroke="#ffd84a" stroke-width="8" opacity=".55">`; for (let xx=0; xx<1600; xx+=140) s += `<line x1="${xx}" y1="780" x2="${xx+70}" y2="780"/>`; s += `</g>`;
  // Lignes de vitesse
  s += `<g stroke="#fff" stroke-linecap="round" opacity=".35">`;
  for (let i=0;i<16;i++){ const yy = 380+r()*260, x0 = 700+r()*300; s += `<line x1="${x0.toFixed(0)}" y1="${yy.toFixed(0)}" x2="${(x0+120+r()*160).toFixed(0)}" y2="${yy.toFixed(0)}" stroke-width="${(2+r()*3).toFixed(1)}"/>`; }
  s += `</g>`;
  // Tirs ennemis et explosions
  const boom = (x,y,k) => { let pts=''; for (let i=0;i<16;i++){ const a=i*Math.PI/8, rr=(i%2?24:52)*k; pts += `${(x+Math.cos(a)*rr).toFixed(1)},${(y+Math.sin(a)*rr).toFixed(1)} `; }
    return `<polygon points="${pts}" fill="#ffb23a" opacity=".9" filter="url(#${p}glow)"/><polygon points="${pts}" fill="#ffd84a"/><circle cx="${x}" cy="${y}" r="${18*k}" fill="#fff6d6"/>`; };
  s += boom(1430,170,1.1) + boom(1080,120,.7) + boom(1480,330,.55);
  for (const [bx,by] of [[1370,250],[1300,190],[1450,420],[1160,240],[1010,300],[1520,250],[960,180]]) s += `<circle cx="${bx}" cy="${by}" r="13" fill="#ff4d8b" stroke="#fff" stroke-width="4"/>`;
  // Salve de biberons
  const bib = (x,y,a) => `<g transform="translate(${x} ${y}) rotate(${a})"><rect x="-9" y="-20" width="18" height="34" rx="7" fill="#fff"/><rect x="-9" y="-4" width="18" height="5" fill="#8fd4ff"/><path d="M-6 -20 Q0 -36 6 -20 Z" fill="#ff9a3d"/></g>`;
  for (const [bx,by] of [[1275,330],[1320,262],[1365,196],[1240,300],[1290,228],[1218,250]]) s += `<path d="M${bx-30} ${by+40} L${bx} ${by}" stroke="#ffe9a8" stroke-width="10" stroke-linecap="round" opacity=".5"/>` + bib(bx,by,38);
  // Bonus doudou
  s += `<g transform="translate(965 250)"><circle r="34" fill="#fff" opacity=".25" stroke="#fff" stroke-width="3"/><circle cx="-12" cy="-14" r="8" fill="#c98a5c"/><circle cx="12" cy="-14" r="8" fill="#c98a5c"/><circle cy="0" r="16" fill="#c98a5c"/><circle cy="18" r="14" fill="#c98a5c"/><circle cx="-5" cy="-2" r="2.5" fill="#2a1a10"/><circle cx="5" cy="-2" r="2.5" fill="#2a1a10"/></g>`;
  // Poussette
  s += `<g transform="translate(1180 520) rotate(-8) scale(1.3)">
    <ellipse cx="0" cy="132" rx="150" ry="14" fill="#000" opacity=".35"/>
    <path d="M-70 95 L-20 55 M75 95 L25 55" stroke="#2a1a3c" stroke-width="7" stroke-linecap="round"/>
    ${[-70,75].map(x=>`<g transform="translate(${x} 95)"><circle r="33" fill="#1e1530" stroke="#ffd84a" stroke-width="4"/><circle r="22" fill="none" stroke="#5a4a9a" stroke-width="2"/>${[0,1,2,3,4,5].map(k=>`<line x1="0" y1="0" x2="${(Math.cos(k*Math.PI/3)*28).toFixed(1)}" y2="${(Math.sin(k*Math.PI/3)*28).toFixed(1)}" stroke="#8a79d0" stroke-width="2.5"/>`).join('')}<circle r="6" fill="#ffd84a"/></g>`).join('')}
    <path d="M-120 0 L-170 -70" stroke="#2a1a3c" stroke-width="7" stroke-linecap="round"/><path d="M-182 -60 L-156 -82" stroke="#ffd84a" stroke-width="10" stroke-linecap="round"/>
    <path d="M-122 0 Q-122 62 -50 62 L72 62 Q112 62 112 0 Z" fill="#fdf4ff" stroke="#ffd84a" stroke-width="4"/>
    <path d="M-106 26 H96" stroke="#ff4d8b" stroke-width="6" stroke-dasharray="14 8"/>
    <path d="M-124 2 A104 104 0 0 1 -24 -100 L-24 2 Z" fill="#ff4d8b"/><path d="M-124 2 A104 104 0 0 1 -24 -100" fill="none" stroke="#ffd84a" stroke-width="4"/><path d="M-24 2 L-88 -78 M-24 2 L-114 -42" stroke="#d6336c" stroke-width="3"/>
    <circle cx="20" cy="-14" r="17" fill="#ffe0cc"/><path d="M12 -18 l8 3 M28 -18 l-8 3" stroke="#5a2a1a" stroke-width="2.5" stroke-linecap="round"/><path d="M14 -6 q6 -4 12 0" stroke="#5a2a1a" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M28 -30 q10 -14 2 -22" stroke="#7a4a2a" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M-20 4 Q50 -22 112 2 Z" fill="#8fd4ff"/>
    <g transform="translate(96 -24) rotate(-40)"><rect x="-8" y="-40" width="16" height="44" rx="4" fill="#3a3550" stroke="#ffd84a" stroke-width="2.5"/><circle cx="0" cy="-46" r="12" fill="#ffe9a8" filter="url(#${p}glow)"/></g>
  </g>`;
  return s;
}

/* ============================================================
   CONSTRUCTION DE LA PAGE
   ============================================================ */
const hero = document.getElementById("hero");
const rail = document.getElementById("rail");
const tiles = document.getElementById("tiles");
const modal = document.getElementById("modal");
document.getElementById("count").textContent = GAMES.length + " jeux";

const narrow = () => matchMedia("(max-width:760px)").matches;
const heroVB = () => narrow() ? "830 0 740 900" : WIDE_VB;

// Hero
hero.innerHTML = GAMES.map((g,i)=>`
  <article class="slide${i===0?' on':''}" data-i="${i}" aria-hidden="${i!==0}">
    <div class="art">${svg(g.scene, heroVB(), narrow()?'xMidYMid slice':'xMaxYMid slice')}</div>
    <div class="hero-copy">
      <div class="kicker"><i style="background:${g.accent}"></i>${g.genre}</div>
      <h1 class="hero-title">${g.title}</h1>
      <div class="meta"><span class="hl">Jouable maintenant</span><span>${g.year}</span>${g.feats.map(f=>`<span class="pill">${FEAT[f]}</span>`).join("")}</div>
      <p class="hero-desc">${g.short}</p>
      <div class="ctas">
        <a class="btn play" href="${g.url}">${I.play}Jouer</a>
        <button class="btn info" data-open="${i}">${I.info}Plus d'infos</button>
      </div>
    </div>
  </article>`).join("") +
  `<div class="dots" role="tablist">${GAMES.map((g,i)=>`<button role="tab" aria-label="${g.name}" class="${i===0?'on':''}" data-go="${i}"><span></span></button>`).join("")}</div>`;

// Rangée d'affiches
rail.innerHTML = GAMES.map((g,i)=>`
  <div class="slot">
    <span class="rank" aria-hidden="true">${i+1}</span>
    <div class="poster" role="button" tabindex="0" data-open="${i}" aria-label="${g.name} — ${g.genre}">
      <div class="art">${svg(g.scene, POSTER_VB)}</div>
      <span class="f" aria-hidden="true">F</span>
      ${g.badge?`<span class="badge">${g.badge}</span>`:""}
      <div class="ptitle">${g.title}</div>
      <div class="tag">${g.tagline}</div>
      <div class="hover">
        <div class="hrow">
          <a class="round solid" href="${g.url}" aria-label="Jouer à ${g.name}" onclick="event.stopPropagation()">${I.play}</a>
          <span class="round" aria-hidden="true">${I.down}</span>
        </div>
        <div class="hname">${g.name}</div>
        <p>${g.short}</p>
        <div class="chips">${chips(g)}</div>
      </div>
    </div>
  </div>`).join("");

// Tuiles « par envie »
tiles.innerHTML = GAMES.map(g=>`
  <a class="tile" href="${g.url}">
    <div class="art">${svg(g.scene, "560 0 1040 585")}</div>
    <div class="tx"><b>${g.univers.label}</b><span>${g.univers.sub} — ${g.name}</span></div>
    <span class="round solid go" aria-hidden="true">${I.play}</span>
  </a>`).join("");

// Flèches de la rangée
const prevB = document.querySelector(".arrow.prev"), nextB = document.querySelector(".arrow.next");
function arrows(){ prevB.disabled = rail.scrollLeft < 8; nextB.disabled = rail.scrollLeft + rail.clientWidth > rail.scrollWidth - 8; }
prevB.onclick = () => rail.scrollBy({left: -rail.clientWidth * .8});
nextB.onclick = () => rail.scrollBy({left:  rail.clientWidth * .8});
rail.addEventListener("scroll", arrows, {passive:true}); addEventListener("resize", arrows); arrows();

// Carrousel
const slides = [...hero.querySelectorAll(".slide")];
const dots = [...hero.querySelectorAll(".dots button")];
const DUR = 9000; let cur = 0, timer = null;
hero.style.setProperty("--dur", DUR/1000+"s");
function go(n){
  cur = (n + slides.length) % slides.length;
  slides.forEach((s,i)=>{ s.classList.toggle("on", i===cur); s.setAttribute("aria-hidden", i!==cur); });
  dots.forEach((d,i)=>{ d.classList.remove("on"); void d.offsetWidth; d.classList.toggle("on", i===cur); });
  restart();
}
function restart(){ clearTimeout(timer); if (!hero.classList.contains("paused") && !modal.open) timer = setTimeout(()=>go(cur+1), DUR); }
dots.forEach(d=>d.addEventListener("click",()=>go(+d.dataset.go)));
hero.addEventListener("mouseenter",()=>{ hero.classList.add("paused"); clearTimeout(timer); });
hero.addEventListener("mouseleave",()=>{ hero.classList.remove("paused"); restart(); });
let tx0 = null;
hero.addEventListener("touchstart",e=>{ tx0 = e.touches[0].clientX; },{passive:true});
hero.addEventListener("touchend",e=>{ if (tx0===null) return; const dx = e.changedTouches[0].clientX - tx0; if (Math.abs(dx) > 45) go(cur + (dx<0?1:-1)); tx0 = null; });
document.addEventListener("visibilitychange",()=>{ document.hidden ? clearTimeout(timer) : restart(); });
restart();

// Recadrage du hero selon l'écran
let wasNarrow = narrow();
addEventListener("resize",()=>{ const n = narrow(); if (n===wasNarrow) return; wasNarrow = n;
  hero.querySelectorAll(".slide .art svg").forEach(s=>{ s.setAttribute("viewBox", heroVB()); s.setAttribute("preserveAspectRatio", n?'xMidYMid slice':'xMaxYMid slice'); }); });

// Fiche (modale)
function openGame(i){
  const g = GAMES[i];
  modal.innerHTML = `
    <div class="m-art">${svg(g.scene, "400 0 1200 675")}
      <button class="round m-close" aria-label="Fermer">${I.close}</button>
      <div class="m-head">
        <div class="hero-title">${g.title}</div>
        <div class="ctas"><a class="btn play" href="${g.url}">${I.play}Jouer</a></div>
      </div>
    </div>
    <div class="m-body">
      <div>
        <div class="meta"><span class="hl">Jouable maintenant</span><span>${g.year}</span><span class="pill">${g.genre}</span></div>
        ${g.long.map(t=>`<p>${t}</p>`).join("")}
      </div>
      <div class="m-side">
        ${Object.entries(g.facts).map(([k,v])=>`<div>${k} : <b>${v}</b></div>`).join("")}
        <div class="m-feats">${chips(g)}</div>
      </div>
    </div>`;
  modal.querySelector(".m-close").onclick = () => modal.close();
  clearTimeout(timer);
  modal.showModal();
}
modal.addEventListener("close", restart);
modal.addEventListener("click", e => { if (e.target === modal) modal.close(); });
document.addEventListener("click", e => { if (e.target.closest("a")) return; const b = e.target.closest("[data-open]"); if (b) openGame(+b.dataset.open); });
document.addEventListener("keydown", e => { const b = e.target.closest && e.target.closest(".poster"); if (b && (e.key==="Enter"||e.key===" ")) { e.preventDefault(); openGame(+b.dataset.open); } });

// Barre opaque au défilement
const bar = document.getElementById("bar");
addEventListener("scroll", () => bar.classList.toggle("solid", scrollY > 40), {passive:true});
</script>
</body>
</html>
