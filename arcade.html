<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#08080b" />
<title>Forge — Arcade</title>
<meta name="description" content="Forge Arcade — Nitro 89, Cassinity, Templier 3188 : des jeux à lancer directement dans le navigateur, sur mobile comme sur PC." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=Cinzel:wght@700;900&family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;1,9..144,400;1,9..144,600&family=Inter+Tight:wght@400;500;600;700&family=Monoton&family=Russo+One&display=swap" rel="stylesheet" />
<style>
  :root{
    --bg:#08080b;
    --ink:#f4f2ee;
    --ink-2:rgba(244,242,238,.72);
    --ink-3:rgba(244,242,238,.48);
    --line:rgba(244,242,238,.12);
    --gutter:clamp(18px,4.2vw,64px);
    --ease:cubic-bezier(.2,.7,.2,1);
  }
  *,*::before,*::after{box-sizing:border-box}
  html{-webkit-font-smoothing:antialiased;background:var(--bg)}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:"Inter Tight",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:15px;line-height:1.5;overflow-x:hidden}
  a{color:inherit;text-decoration:none}
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
  svg{display:block}

  /* ---------- Top bar ---------- */
  .bar{position:fixed;inset:0 0 auto 0;z-index:30;display:flex;align-items:center;justify-content:space-between;
       padding:calc(14px + env(safe-area-inset-top)) var(--gutter) 14px;
       background:linear-gradient(180deg,rgba(8,8,11,.85),rgba(8,8,11,0));transition:background .4s ease}
  .bar.solid{background:rgba(8,8,11,.94);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
  .brand{display:flex;align-items:baseline;gap:12px}
  .brand .mark{font-family:"Fraunces",serif;font-weight:300;letter-spacing:.32em;font-size:18px;text-transform:uppercase}
  .brand .sub{font-size:10px;letter-spacing:.34em;text-transform:uppercase;color:#e7c56f;font-weight:600}
  .bar nav{display:flex;gap:26px;font-size:13px;color:var(--ink-2)}
  .bar nav a:hover{color:var(--ink)}
  @media (max-width:560px){.bar nav .hide-sm{display:none}}

  /* ---------- Hero billboard ---------- */
  .hero{position:relative;height:min(88vh,860px);min-height:560px;overflow:hidden;isolation:isolate}
  .slide{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity 1s ease,visibility 0s linear 1s}
  .slide.on{opacity:1;visibility:visible;transition:opacity 1s ease}
  .slide .art{position:absolute;inset:0;z-index:-2}
  .slide .art svg{width:100%;height:100%}
  .slide.on .art svg{animation:kb 16s ease-out both}
  @keyframes kb{from{transform:scale(1.07)}to{transform:scale(1)}}
  .slide::before{content:"";position:absolute;inset:0;z-index:-1;
    background:
      linear-gradient(90deg,rgba(8,8,11,.92) 0%,rgba(8,8,11,.70) 28%,rgba(8,8,11,.15) 55%,rgba(8,8,11,0) 70%),
      linear-gradient(0deg,var(--bg) 0%,rgba(8,8,11,.55) 18%,rgba(8,8,11,0) 42%)}
  .hero-copy{position:absolute;left:var(--gutter);bottom:clamp(90px,15vh,150px);width:min(520px,calc(100% - 2*var(--gutter)))}
  .kicker{display:inline-flex;align-items:center;gap:10px;font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:var(--ink-2);font-weight:600;margin-bottom:14px}
  .kicker i{width:22px;height:2px;background:currentColor;display:block}
  .hero-title{margin:0 0 16px;line-height:.95}
  .meta{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;font-size:13px;color:var(--ink-2);margin-bottom:14px}
  .meta .hl{color:#5fe3a8;font-weight:700}
  .meta .pill{border:1px solid rgba(244,242,238,.35);border-radius:3px;padding:1px 6px;font-size:11px;letter-spacing:.06em}
  .hero-desc{font-size:clamp(15px,1.3vw,18px);color:var(--ink);margin:0 0 24px;text-shadow:0 1px 12px rgba(0,0,0,.6)}
  .ctas{display:flex;gap:12px;flex-wrap:wrap}
  .btn{display:inline-flex;align-items:center;gap:10px;height:48px;padding:0 26px 0 20px;border-radius:6px;font-weight:700;font-size:16px;transition:transform .2s var(--ease),background .2s ease}
  .btn:active{transform:scale(.97)}
  .btn svg{width:22px;height:22px}
  .btn.play{background:var(--ink);color:#0b0b0e}
  .btn.play:hover{background:#fff}
  .btn.info{background:rgba(120,120,130,.42);color:var(--ink);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
  .btn.info:hover{background:rgba(140,140,150,.6)}
  .dots{position:absolute;right:var(--gutter);bottom:clamp(96px,15.5vh,156px);display:flex;gap:8px;z-index:2}
  .dots button{width:26px;height:4px;border-radius:2px;background:rgba(244,242,238,.3);overflow:hidden;position:relative}
  .dots button span{position:absolute;inset:0;background:var(--ink);transform-origin:left;transform:scaleX(0)}
  .dots button.on span{animation:prog var(--dur,9s) linear forwards}
  .hero.paused .dots button.on span{animation-play-state:paused}
  @keyframes prog{to{transform:scaleX(1)}}

  @media (max-width:760px){
    .hero{height:auto;min-height:0;aspect-ratio:auto}
    .hero{height:min(92svh,780px)}
    .slide::before{background:linear-gradient(0deg,var(--bg) 2%,rgba(8,8,11,.88) 30%,rgba(8,8,11,.25) 58%,rgba(8,8,11,0) 75%)}
    .hero-copy{bottom:76px;text-align:center;left:50%;transform:translateX(-50%)}
    .kicker,.meta,.ctas{justify-content:center}
    .hero-desc{font-size:15px}
    .dots{left:50%;right:auto;transform:translateX(-50%);bottom:36px}
    .btn{flex:1;justify-content:center;max-width:220px}
  }

  /* ---------- Game title treatments ---------- */
  .t-nitro{font-family:"Monoton",cursive;font-weight:400;letter-spacing:.04em;color:#ffe23a;
    text-shadow:0 0 18px rgba(255,46,136,.75),0 0 42px rgba(255,106,61,.45);display:inline-flex;align-items:baseline;gap:.12em}
  .t-nitro em{font-style:normal;font-family:"Russo One",sans-serif;color:#fff;-webkit-text-stroke:0;text-shadow:3px 3px 0 #ff2e88,0 0 24px rgba(255,46,136,.8)}
  .t-cass{font-family:"Fraunces",serif;font-style:italic;font-weight:600;color:#e9c97e;letter-spacing:.01em;
    text-shadow:0 2px 24px rgba(0,0,0,.6)}
  .t-cass small{display:block;font-style:normal;font-weight:500;font-family:"Inter Tight",sans-serif;font-size:.17em;letter-spacing:.42em;text-transform:uppercase;color:#cfe3d6;margin-top:.55em}
  .t-temp{font-family:"Cinzel",serif;font-weight:900;color:#efe3c6;letter-spacing:.06em;
    text-shadow:0 0 28px rgba(192,22,31,.55),0 2px 0 #5c0a0e;display:inline-flex;flex-direction:column;line-height:.9}
  .t-temp b{font-family:"Chakra Petch",sans-serif;font-weight:700;font-size:.5em;color:#ff3b30;letter-spacing:.5em;margin-top:.2em;text-shadow:0 0 16px rgba(255,48,48,.7)}
  .hero-title .t-nitro{font-size:clamp(46px,7vw,92px)}
  .hero-title .t-cass{font-size:clamp(56px,8vw,112px)}
  .hero-title .t-temp{font-size:clamp(46px,6.6vw,88px)}

  /* ---------- Rows ---------- */
  main{position:relative;z-index:2;margin-top:-56px;padding-bottom:40px}
  @media (max-width:760px){main{margin-top:22px}}
  .row{padding:0 var(--gutter);margin-bottom:46px}
  .row h2{font-size:clamp(18px,1.6vw,22px);font-weight:700;margin:0 0 16px;display:flex;align-items:center;gap:10px}
  .row h2 .count{font-size:12px;font-weight:600;color:var(--ink-3);letter-spacing:.08em}
  .rail{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(250px,1fr);gap:clamp(14px,2vw,28px);
        overflow-x:auto;scroll-snap-type:x mandatory;padding:10px 4px 26px;margin:-10px -4px 0;scrollbar-width:none}
  .rail::-webkit-scrollbar{display:none}
  @media (min-width:1100px){.rail{grid-auto-columns:1fr;overflow:visible}}
  .slot{display:flex;align-items:flex-end;scroll-snap-align:start}
  .rank{font-family:"Inter Tight",sans-serif;font-weight:700;font-size:clamp(130px,13vw,210px);line-height:.72;letter-spacing:-.06em;
        color:var(--bg);-webkit-text-stroke:3px rgba(244,242,238,.55);margin-right:-.14em;user-select:none;flex:none;position:relative;z-index:0}
  .poster{position:relative;z-index:1;flex:1;min-width:0;aspect-ratio:2/3;border-radius:8px;overflow:hidden;background:#111;
          box-shadow:0 18px 40px -18px rgba(0,0,0,.9);transition:transform .35s var(--ease),box-shadow .35s ease;outline:none;text-align:left;display:block;width:100%}
  .poster .art,.poster .art svg{position:absolute;inset:0;width:100%;height:100%}
  .poster::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,rgba(0,0,0,.92) 0%,rgba(0,0,0,.35) 32%,rgba(0,0,0,0) 52%);pointer-events:none}
  .poster .f{position:absolute;top:12px;left:12px;z-index:2;font-family:"Fraunces",serif;font-weight:500;font-size:22px;color:#e7c56f;text-shadow:0 1px 6px rgba(0,0,0,.7)}
  .poster .badge{position:absolute;top:0;right:12px;z-index:2;background:#c0161f;color:#fff;font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;padding:10px 7px 6px;border-radius:0 0 4px 4px}
  .poster .ptitle{position:absolute;left:0;right:0;bottom:62px;z-index:2;text-align:center;padding:0 14px}
  .poster .ptitle .t-nitro{font-size:clamp(34px,3.6vw,50px)}
  .poster .ptitle .t-cass{font-size:clamp(40px,4.2vw,58px)}
  .poster .ptitle .t-temp{font-size:clamp(32px,3.3vw,46px)}
  .poster .tag{position:absolute;left:0;right:0;bottom:22px;z-index:2;text-align:center;font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--ink-2);font-weight:600}
  .poster .hover{position:absolute;inset:0;z-index:3;display:flex;flex-direction:column;justify-content:flex-end;padding:18px;gap:10px;
                 background:linear-gradient(0deg,rgba(6,6,9,.97) 0%,rgba(6,6,9,.9) 42%,rgba(6,6,9,.35) 70%,rgba(6,6,9,0) 100%);
                 opacity:0;transform:translateY(8px);transition:opacity .3s ease,transform .3s var(--ease)}
  .poster .hover p{margin:0;font-size:13.5px;color:var(--ink-2)}
  .poster .hover .hrow{display:flex;gap:8px;align-items:center}
  .round{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;border:2px solid rgba(244,242,238,.5);background:rgba(20,20,24,.6);transition:border-color .2s,background .2s}
  .round:hover{border-color:var(--ink)}
  .round.solid{background:var(--ink);border-color:var(--ink);color:#0b0b0e}
  .round svg{width:20px;height:20px}
  .poster .hover .hname{font-weight:700;font-size:17px}
  .poster .hover .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chip{font-size:11px;font-weight:600;color:var(--ink-2);border:1px solid var(--line);border-radius:999px;padding:3px 9px;display:inline-flex;align-items:center;gap:5px}
  .chip svg{width:13px;height:13px}
  @media (hover:hover){
    .slot:hover .poster,.poster:focus-visible{transform:scale(1.045) translateY(-6px);box-shadow:0 30px 60px -20px rgba(0,0,0,.95),0 0 0 2px rgba(244,242,238,.85)}
    .slot:hover .poster .hover,.poster:focus-visible .hover{opacity:1;transform:none}
  }
  .poster:focus-visible{box-shadow:0 0 0 3px #fff}

  /* ---------- Univers strip ---------- */
  .tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(12px,1.6vw,22px)}
  @media (max-width:760px){.tiles{grid-template-columns:1fr}}
  .tile{position:relative;aspect-ratio:16/9;border-radius:8px;overflow:hidden;display:block;background:#111;transition:transform .3s var(--ease)}
  .tile .art,.tile .art svg{position:absolute;inset:0;width:100%;height:100%}
  .tile::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.85),rgba(0,0,0,.1) 70%)}
  .tile .tx{position:absolute;left:18px;bottom:16px;right:40%;z-index:2}
  .tile .tx b{display:block;font-size:17px;margin-bottom:3px}
  .tile .tx span{font-size:12.5px;color:var(--ink-2)}
  .tile:hover{transform:translateY(-3px)}
  .tile .go{position:absolute;right:16px;bottom:16px;z-index:2}

  /* ---------- Modal ---------- */
  dialog{border:0;padding:0;background:#141418;color:var(--ink);border-radius:10px;width:min(860px,calc(100% - 24px));max-height:calc(100dvh - 40px);overflow:auto;box-shadow:0 40px 120px rgba(0,0,0,.8)}
  dialog::backdrop{background:rgba(0,0,0,.72);backdrop-filter:blur(3px)}
  dialog[open]{animation:pop .35s var(--ease)}
  @keyframes pop{from{opacity:0;transform:translateY(20px) scale(.97)}to{opacity:1;transform:none}}
  .m-art{position:relative;aspect-ratio:16/9}
  .m-art > svg{position:absolute;inset:0;width:100%;height:100%}
  .m-art::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,#141418 0%,rgba(20,20,24,0) 55%)}
  .m-head{position:absolute;left:clamp(18px,4vw,44px);bottom:clamp(14px,3vw,30px);z-index:2}
  .m-head .hero-title{margin-bottom:16px}
  .m-head .t-nitro{font-size:clamp(34px,6vw,64px)}
  .m-head .t-cass{font-size:clamp(42px,7vw,78px)}
  .m-head .t-temp{font-size:clamp(32px,5.6vw,60px)}
  .m-close{position:absolute;top:14px;right:14px;z-index:3}
  .m-body{display:grid;grid-template-columns:1.7fr 1fr;gap:28px;padding:6px clamp(18px,4vw,44px) 36px}
  @media (max-width:640px){.m-body{grid-template-columns:1fr;gap:18px}}
  .m-body p{margin:0 0 12px;color:var(--ink);font-size:15.5px}
  .m-side{font-size:13.5px;color:var(--ink-3)}
  .m-side div{margin-bottom:10px}
  .m-side b{color:var(--ink-2);font-weight:500}
  .m-feats{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}

  footer{padding:30px var(--gutter) calc(40px + env(safe-area-inset-bottom));color:var(--ink-3);font-size:12.5px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}
  footer a:hover{color:var(--ink)}

  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation:none!important;transition:none!important}
  }
</style>
</head>
<body>

<header class="bar" id="bar">
  <a class="brand" href="index.html" aria-label="Forge — accueil">
    <span class="mark">Forge</span><span class="sub">Arcade</span>
  </a>
  <nav>
    <a href="#affiche">À l'affiche</a>
    <a href="#univers" class="hide-sm">Univers</a>

  </nav>
</header>

<section class="hero" id="hero" aria-roledescription="carrousel" aria-label="Jeux à la une"></section>

<main>
  <section class="row" id="affiche">

  <section class="row" id="univers">

</main>

<footer>
  <span>Forge Arcade · Jeux jouables directement dans le navigateur — iPhone, Android, PC.</span>

</footer>

<dialog id="modal" aria-label="Fiche du jeu"></dialog>

  // Hordes (yeux rouges)
  const mobs = [];
  for (let i=0;i<110;i++){ const y = 680 + Math.pow(r(),.8)*220; let xx = r()*1700-50; if (Math.abs(xx-1200) < 200 && y > 720) xx += (xx<1200?-1:1)*220; mobs.push([xx,y]); }
  mobs.sort((a,b)=>a[1]-b[1]);
  for (const [mx,my] of mobs){
    const k = 0.25 + (my-680)/220*1.15;
    s += `<g transform="translate(${mx.toFixed(1)} ${my.toFixed(1)}) scale(${k.toFixed(2)})"><path d="M-20 60 L-16 0 Q-14 -18 0 -20 Q14 -18 16 0 L20 60 Z M-16 4 L-34 -26 L-28 -30 L-10 -4 Z M16 4 L34 -26 L28 -30 L10 -4 Z" fill="#0c0306"/><ellipse cx="0" cy="-30" rx="12" ry="13" fill="#0c0306"/><path d="M-12 -34 L12 -30 M-12 -26 L12 -22" stroke="#2a1416" stroke-width="2"/><circle cx="-4.5" cy="-30" r="2.4" fill="#ff3030"/><circle cx="4.5" cy="-30" r="2.4" fill="#ff3030"/></g>`;
  }
  // Templier
  s += `<g>
    <path d="M1112 372 C1060 520 1030 700 990 900 L1410 900 C1370 700 1340 520 1288 372 Z" fill="url(#${p}cape)"/>
    <path d="M1112 372 C1080 470 1060 560 1048 660" stroke="#a51a22" stroke-width="2" fill="none" opacity=".6"/>
    <polygon points="1148,690 1192,690 1188,866 1138,866" fill="url(#${p}steel)" stroke="#7d6127" stroke-width="2"/>
    <polygon points="1208,690 1252,690 1262,866 1212,866" fill="url(#${p}steel)" stroke="#7d6127" stroke-width="2"/>
    <rect x="1126" y="856" width="70" height="32" rx="6" fill="#1a1416" stroke="#7d6127" stroke-width="2"/>
    <rect x="1204" y="856" width="70" height="32" rx="6" fill="#1a1416" stroke="#7d6127" stroke-width="2"/>
    <circle cx="1166" cy="776" r="19" fill="#2a2326" stroke="#d9b25a" stroke-width="2.5"/><circle cx="1234" cy="776" r="19" fill="#2a2326" stroke="#d9b25a" stroke-width="2.5"/>
    <circle cx="1166" cy="776" r="5" fill="#ff6a3d"/><circle cx="1234" cy="776" r="5" fill="#ff6a3d"/>
    <path d="M1128 382 L1272 382 L1260 566 L1140 566 Z" fill="url(#${p}steel)" stroke="#7d6127" stroke-width="2"/>
    <path d="M1142 432 L1258 432 L1266 724 L1200 752 L1134 724 Z" fill="url(#${p}bone)"/>
    <path d="M1189 456 L1211 456 L1213 512 L1252 510 L1252 534 L1213 532 L1216 690 L1184 690 L1187 532 L1148 534 L1148 510 L1187 512 Z" fill="#c0161f"/>
    <rect x="1138" y="560" width="124" height="16" fill="#3a2a1a" stroke="#d9b25a" stroke-width="2"/>
    <rect x="1190" y="557" width="20" height="22" fill="none" stroke="#d9b25a" stroke-width="2.5"/>
    <polygon points="1058,436 1100,436 1096,566 1066,566" fill="url(#${p}steel)" stroke="#7d6127" stroke-width="2"/>
    <polygon points="1072,610 1088,610 1086,862 1080,890 1074,862" fill="#d3dbe1"/>
    <line x1="1080" y1="616" x2="1080" y2="860" stroke="#8d989f" stroke-width="2"/>
    <rect x="1036" y="598" width="88" height="11" rx="3" fill="#d9b25a"/>
    <rect x="1075" y="560" width="10" height="40" fill="#2a1a10"/>
    <rect x="1058" y="562" width="44" height="34" rx="7" fill="#2a2326" stroke="#d9b25a" stroke-width="2"/>
    <circle cx="1080" cy="553" r="9" fill="#d9b25a"/>
    <path d="M1060 378 C1060 350 1100 336 1140 348 L1146 430 L1056 446 Z" fill="url(#${p}steel)" stroke="#d9b25a" stroke-width="3"/>
    <path d="M1062 410 L1146 398 M1060 428 L1146 418" stroke="#d9b25a" stroke-width="1.6" opacity=".7"/>
    <g transform="rotate(-10 1320 450)">
      <rect x="1290" y="440" width="66" height="200" rx="10" fill="url(#${p}steel)" stroke="#d9b25a" stroke-width="2.5"/>
      <path d="M1290 486 H1356 M1290 532 H1356 M1290 578 H1356" stroke="#d9b25a" stroke-width="1.6" opacity=".7"/>
      <rect x="1300" y="636" width="46" height="74" rx="4" fill="#120d0f" stroke="#7d6127" stroke-width="2"/>
      <circle cx="1323" cy="712" r="18" fill="#ff6a3d" filter="url(#${p}glow)"/><circle cx="1323" cy="712" r="9" fill="#ffd27a"/>
    </g>
    <path d="M1340 378 C1340 350 1300 336 1260 348 L1254 430 L1344 446 Z" fill="url(#${p}steel)" stroke="#d9b25a" stroke-width="3"/>
    <path d="M1338 410 L1254 398 M1340 428 L1254 418" stroke="#d9b25a" stroke-width="1.6" opacity=".7"/>
    <rect x="1178" y="338" width="44" height="40" fill="#1a1416"/>
    <path d="M1148 236 C1148 186 1252 186 1252 236 L1258 334 Q1200 356 1142 334 Z" fill="url(#${p}steel)" stroke="#d9b25a" stroke-width="2.5"/>
    <rect x="1197" y="194" width="6" height="64" fill="#d9b25a"/>
    <rect x="1158" y="270" width="84" height="10" rx="2" fill="#ff3030" filter="url(#${p}glow)"/>
    <rect x="1196" y="276" width="8" height="44" rx="2" fill="#ff3030" filter="url(#${p}glow)"/>
    <rect x="1158" y="270" width="84" height="10" rx="2" fill="#ff5a4a"/>
    <rect x="1196" y="276" width="8" height="44" rx="2" fill="#ff5a4a"/>
    ${[0,1,2].map(i=>`<circle cx="${1166+i*9}" cy="${306+i*5}" r="2.2" fill="#0c0809"/><circle cx="${1234-i*9}" cy="${306+i*5}" r="2.2" fill="#0c0809"/>`).join("")}
  </g>`;
  // Braises
  for (let i=0;i<46;i++){
    const ex = r()*1600, ey = 520+r()*380, dur = (5+r()*7).toFixed(1), beg = (-r()*10).toFixed(1), rad = (1+r()*2.6).toFixed(1);
    s += `<circle cx="${ex.toFixed(0)}" cy="${ey.toFixed(0)}" r="${rad}" fill="${r()<.5?'#ff8a3d':'#ffd27a'}"><animate attributeName="cy" from="${ey.toFixed(0)}" to="${(ey-420).toFixed(0)}" dur="${dur}s" begin="${beg}s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;.8;0" dur="${dur}s" begin="${beg}s" repeatCount="indefinite"/></circle>`;
  }
  return s;
}

/* ============================================================
   CONSTRUCTION DE LA PAGE
   ============================================================ */
const hero = document.getElementById("hero");
const rail = document.getElementById("rail");
const tiles = document.getElementById("tiles");
const modal = document.getElementById("modal");
document.getElementById("count").textContent = GAMES.length + " jeux";

const narrow = () => matchMedia("(max-width:760px)").matches;
const heroVB = () => narrow() ? "830 0 740 900" : WIDE_VB;

// Hero
hero.innerHTML = GAMES.map((g,i)=>`
  <article class="slide${i===0?' on':''}" data-i="${i}" aria-hidden="${i!==0}">
    <div class="art">${svg(g.scene, heroVB(), narrow()?'xMidYMid slice':'xMaxYMid slice')}</div>
    <div class="hero-copy">
      <div class="kicker"><i style="background:${g.accent}"></i>${g.genre}</div>
      <h1 class="hero-title">${g.title}</h1>
      <div class="meta"><span class="hl">Jouable maintenant</span><span>${g.year}</span>${g.feats.map(f=>`<span class="pill">${FEAT[f]}</span>`).join("")}</div>
      <p class="hero-desc">${g.short}</p>
      <div class="ctas">
        <a class="btn play" href="${g.url}">${I.play}Jouer</a>
        <button class="btn info" data-open="${i}">${I.info}Plus d'infos</button>
      </div>
    </div>
  </article>`).join("") +
  `<div class="dots" role="tablist">${GAMES.map((g,i)=>`<button role="tab" aria-label="${g.name}" class="${i===0?'on':''}" data-go="${i}"><span></span></button>`).join("")}</div>`;

// Rangée d'affiches
rail.innerHTML = GAMES.map((g,i)=>`
  <div class="slot">
    <span class="rank" aria-hidden="true">${i+1}</span>
    <div class="poster" role="button" tabindex="0" data-open="${i}" aria-label="${g.name} — ${g.genre}">
      <div class="art">${svg(g.scene, POSTER_VB)}</div>
      <span class="f" aria-hidden="true">F</span>
      ${g.badge?`<span class="badge">${g.badge}</span>`:""}
      <div class="ptitle">${g.title}</div>
      <div class="tag">${g.tagline}</div>
      <div class="hover">
        <div class="hrow">
          <a class="round solid" href="${g.url}" aria-label="Jouer à ${g.name}" onclick="event.stopPropagation()">${I.play}</a>
          <span class="round" aria-hidden="true">${I.down}</span>
        </div>
        <div class="hname">${g.name}</div>
        <p>${g.short}</p>
        <div class="chips">${chips(g)}</div>
      </div>
    </div>
  </div>`).join("");

// Tuiles « par envie »
tiles.innerHTML = GAMES.map(g=>`
  <a class="tile" href="${g.url}">
    <div class="art">${svg(g.scene, "560 0 1040 585")}</div>
    <div class="tx"><b>${g.univers.label}</b><span>${g.univers.sub} — ${g.name}</span></div>
    <span class="round solid go" aria-hidden="true">${I.play}</span>
  </a>`).join("");

// Carrousel
const slides = [...hero.querySelectorAll(".slide")];
const dots = [...hero.querySelectorAll(".dots button")];
const DUR = 9000; let cur = 0, timer = null;
hero.style.setProperty("--dur", DUR/1000+"s");
function go(n){
  cur = (n + slides.length) % slides.length;
  slides.forEach((s,i)=>{ s.classList.toggle("on", i===cur); s.setAttribute("aria-hidden", i!==cur); });
  dots.forEach((d,i)=>{ d.classList.remove("on"); void d.offsetWidth; d.classList.toggle("on", i===cur); });
  restart();
}
function restart(){ clearTimeout(timer); if (!hero.classList.contains("paused") && !modal.open) timer = setTimeout(()=>go(cur+1), DUR); }
dots.forEach(d=>d.addEventListener("click",()=>go(+d.dataset.go)));
hero.addEventListener("mouseenter",()=>{ hero.classList.add("paused"); clearTimeout(timer); });
hero.addEventListener("mouseleave",()=>{ hero.classList.remove("paused"); restart(); });
let tx0 = null;
hero.addEventListener("touchstart",e=>{ tx0 = e.touches[0].clientX; },{passive:true});
hero.addEventListener("touchend",e=>{ if (tx0===null) return; const dx = e.changedTouches[0].clientX - tx0; if (Math.abs(dx) > 45) go(cur + (dx<0?1:-1)); tx0 = null; });
document.addEventListener("visibilitychange",()=>{ document.hidden ? clearTimeout(timer) : restart(); });
restart();

// Recadrage du hero selon l'écran
let wasNarrow = narrow();
addEventListener("resize",()=>{ const n = narrow(); if (n===wasNarrow) return; wasNarrow = n;
  hero.querySelectorAll(".slide .art svg").forEach(s=>{ s.setAttribute("viewBox", heroVB()); s.setAttribute("preserveAspectRatio", n?'xMidYMid slice':'xMaxYMid slice'); }); });

// Fiche (modale)
function openGame(i){
  const g = GAMES[i];
  modal.innerHTML = `
    <div class="m-art">${svg(g.scene, "400 0 1200 675")}
      <button class="round m-close" aria-label="Fermer">${I.close}</button>
      <div class="m-head">
        <div class="hero-title">${g.title}</div>
        <div class="ctas"><a class="btn play" href="${g.url}">${I.play}Jouer</a></div>
      </div>
    </div>
    <div class="m-body">
      <div>
        <div class="meta"><span class="hl">Jouable maintenant</span><span>${g.year}</span><span class="pill">${g.genre}</span></div>
        ${g.long.map(t=>`<p>${t}</p>`).join("")}
      </div>
      <div class="m-side">
        ${Object.entries(g.facts).map(([k,v])=>`<div>${k} : <b>${v}</b></div>`).join("")}
        <div class="m-feats">${chips(g)}</div>
      </div>
    </div>`;
  modal.querySelector(".m-close").onclick = () => modal.close();
  clearTimeout(timer);
  modal.showModal();
}
modal.addEventListener("close", restart);
modal.addEventListener("click", e => { if (e.target === modal) modal.close(); });
document.addEventListener("click", e => { if (e.target.closest("a")) return; const b = e.target.closest("[data-open]"); if (b) openGame(+b.dataset.open); });
document.addEventListener("keydown", e => { const b = e.target.closest && e.target.closest(".poster"); if (b && (e.key==="Enter"||e.key===" ")) { e.preventDefault(); openGame(+b.dataset.open); } });

// Barre opaque au défilement
const bar = document.getElementById("bar");
addEventListener("scroll", () => bar.classList.toggle("solid", scrollY > 40), {passive:true});
</script>
</body>
</html>
